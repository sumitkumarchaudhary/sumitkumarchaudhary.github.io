<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile & Verification - Fleet Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            font-size: 2rem;
        }
        .doc-preview-card {
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            border-radius: 0.5rem;
            padding: 12px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .doc-preview-card:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }
        .doc-thumbnail {
            height: 140px;
            object-fit: cover;
            border-radius: 0.375rem;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 850px;">
        
        <!-- Back Navigation Button -->
        <a onclick="history.back()" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
        </a>

        <!-- Main Profile Card Container -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Response / Notification Message Box -->
                <div id="msg"></div>

                <!-- Content Area -->
                <div id="profile-container">
                    <div class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        <span class="small">Loading user profile and verification documents...</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        const token = localStorage.getItem('accessToken');

        // Extract user ID from URL query parameters (e.g. profile.html?id=3). If absent, defaults to logged-in user endpoint '/users/me/'
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        async function fetchUserProfile() {
            const container = document.getElementById('profile-container');

            if (!token) {
                container.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Authentication token missing. Please log in.
                    </div>`;
                return;
            }

            try {
                const endpoint = userId ? `${API_BASE}/users/${userId}/` : `${API_BASE}/users/me/`;
                
                const response = await fetch(endpoint, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch user profile data.");

                const user = await response.json();
                const profile = user.profile || {};
				const rawFirstName = user.first_name || '';
				const rawLastName = user.last_name || '';
				const formatTitleCase = (str) => str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
				const fullName = `${formatTitleCase(rawFirstName)} ${formatTitleCase(rawLastName)}`.trim() || user.username;
                <!-- const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.username; -->
                const roleBadge = user.role ? user.role.toUpperCase() : (profile.role ? profile.role.toUpperCase() : 'USER');
                const emailVerified = profile.email_verified ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Verified</span>' : '<span class="badge bg-warning-subtle text-warning border border-warning-subtle">Pending</span>';
                const phoneVerified = profile.phone_verified ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Verified</span>' : '<span class="badge bg-warning-subtle text-warning border border-warning-subtle">Pending</span>';

                let subscriptionHtml = '<span class="text-muted">Inactive / Not Subscribed</span>';
                if (profile.is_subscribed) {
                    let dateStr = profile.subscription_end_date ? ` (Active till: ${new Date(profile.subscription_end_date).toLocaleDateString()})` : '';
                    subscriptionHtml = `<span class="text-success fw-bold">Active Subscriber${dateStr}</span>`;
                }

                // Document rendering logic (ID Proof & Driving License)
                const idProofUrl = profile.id_proof_url || profile.id_proof || null;
                const dlUrl = profile.driving_license_url || profile.driving_license || null;

                container.innerHTML = `
                    <!-- User Header Banner -->
                    <div class="d-flex flex-column flex-sm-row align-items-center gap-3 mb-4 pb-4 border-bottom text-center text-sm-start">
                        <div class="profile-avatar bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold">
                            ${user.first_name ? user.first_name.charAt(0).toUpperCase() : '<i class="fa-solid fa-user"></i>'}
                        </div>
                        <div>
                            <div class="d-flex align-items-center justify-content-center justify-content-sm-start gap-2 mb-1">
                                <h3 class="fw-bold text-dark mb-0">${fullName}</h3>
                                <span class="badge bg-secondary-subtle text-secondary border text-uppercase" style="font-size: 0.65rem;">${roleBadge}</span>
                            </div>
                            <p class="text-muted small mb-0"><i class="fa-solid me-1"></i> @${user.username}</p>
                        </div>
                    </div>

                    <!-- Details Grid Section -->
                    <div class="row g-4 mb-4">
                        <!-- Contact Info Card -->
                        <div class="col-12 col-md-6">
                            <div class="p-3 bg-light rounded-3 border h-100">
                                <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-address-book me-1 text-primary"></i> Contact Information</h6>
                                <div class="mb-2 small">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">EMAIL ADDRESS</span>
                                    <div class="d-flex justify-content-between align-items-center mt-1">
                                        <span class="fw-medium text-dark text-truncate me-2">${user.email || 'Not provided'}</span>
                                        ${user.email ? emailVerified : ''}
                                    </div>
                                </div>
                                <div class="small mt-3">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">PHONE NUMBER</span>
                                    <div class="d-flex justify-content-between align-items-center mt-1">
                                        <span class="fw-medium text-dark text-truncate me-2">${profile.phone_number || 'Not provided'}</span>
                                        ${profile.phone_number ? phoneVerified : ''}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Account & Subscription Status Card -->
                        <div class="col-12 col-md-6">
                            <div class="p-3 bg-light rounded-3 border h-100">
                                <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-shield-halved me-1 text-primary"></i> Account Status</h6>
                                <div class="mb-2 small">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">SUBSCRIPTION STATUS</span>
                                    <div class="mt-1">${subscriptionHtml}</div>
                                </div>
                                <div class="small mt-3">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">MEMBER SINCE</span>
                                    <div class="fw-medium text-dark mt-1">${user.date_joined ? new Date(user.date_joined).toLocaleDateString() : 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Verification Documents Section (ID Proof & Driving License) -->
                    <div class="p-4 bg-light rounded-3 border mb-4">
                        <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-id-card me-1 text-primary"></i> Verification Documents (ID & Driving License)</h6>
                        
                        <div class="row g-3">
                            <!-- ID Proof Column -->
                            <div class="col-12 col-sm-6">
                                <div class="doc-preview-card">
                                    <span class="text-uppercase text-muted fw-semibold d-block mb-2" style="font-size: 0.7rem;">Government ID Proof</span>
                                    ${idProofUrl ? `
                                        <a href="${idProofUrl}" target="_blank" title="Click to view full size">
                                            <img src="${idProofUrl}" alt="ID Proof" class="doc-thumbnail mb-2 border shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/400x150?text=Document+File';">
                                        </a>
                                        <a href="${idProofUrl}" target="_blank" class="btn btn-outline-primary btn-sm w-150 fw-semibold">
                                            <i class="fa-solid fa-magnifying-glass me-1"></i> View Full ID
                                        </a>
                                    ` : `
                                        <div class="py-4 text-muted small fst-italic">
                                            <i class="fa-solid fa-triangle-exclamation mb-1 d-block text-warning fs-5"></i> No ID proof uploaded yet.
                                        </div>
                                    `}
                                </div>
                            </div>

                            <!-- Driving License Column -->
                            <div class="col-12 col-sm-6">
                                <div class="doc-preview-card">
                                    <span class="text-uppercase text-muted fw-semibold d-block mb-2" style="font-size: 0.7rem;">Driving License (DL)</span>
                                    ${dlUrl ? `
                                        <a href="${dlUrl}" target="_blank" title="Click to view full size">
                                            <img src="${dlUrl}" alt="Driving License" class="doc-thumbnail mb-2 border shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/400x150?text=Document+File';">
                                        </a>
                                        <a href="${dlUrl}" target="_blank" class="btn btn-outline-primary btn-sm w-150 fw-semibold">
                                            <i class="fa-solid fa-magnifying-glass me-1"></i> View Full DL
                                        </a>
                                    ` : `
                                        <div class="py-4 text-muted small fst-italic">
                                            <i class="fa-solid fa-triangle-exclamation mb-1 d-block text-warning fs-5"></i> No Driving License uploaded yet.
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Footer -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="index.html" class="btn btn-outline-secondary btn-sm fw-semibold px-3">
                            <i class="fa-solid fa-house me-1"></i> Dashboard
                        </a>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error loading profile: ${err.message}
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchUserProfile);
    </script>
</body>
</html>
