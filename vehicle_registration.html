<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration with JS Validation</title>
	
	<!-- Local Bootstrap Compiled CSS -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
	<!-- Local FontAwesome Icons -->
	<link href="static/css/all.min.css" rel="stylesheet">
	
	<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .toast-container {
            z-index: 1080;
        }
		.hidden { display: none !important; }
		.btn-check:checked + .btn {
            background-color: #e6f0ff !important; /* Soft custom blue background */
            border-color: #0d6efd !important;      /* Primary border */
            color: #0b5ed7 !important;             /* Primary text */
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1); /* Subtle focus glow */
        }
		.border-dashed {
            border-style: dashed !important;
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .header-icon-box {
            width: 56px;
            height: 56px;
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 12px auto;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">
<div class="container my-4" style="max-width: 900px;">
    
    <!-- Back Button -->
    <a href="index.html" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
    </a>

    <!-- Registration Card -->
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-sm-5">
            <!-- Highly Visible Header Section -->
            <div class="text-center mb-5 pb-3 border-bottom">
                <div class="header-icon-box shadow-sm">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">Add New Vehicle</h2>
                <p class="text-muted small mb-0">Register a commercial transport unit to your fleet management profile.</p>
            </div>
            
			<!-- <h3 class="fw-bold text-dark mb-0">Create an Account</h3> -->
            
            <form id="vehicleRegistrationForm" novalidate>
                
                <!-- Commercial Vehicle Type (Radio Grid) -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold">Commercial Vehicle Type</label>
                    <div class="row g-2">
                        <div class="col-12 col-sm-6">
                            <input type="radio" class="btn-check" name="vehicle_type" id="type_small" value="small" required>
                            <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_small">
                                Small (≤ 3.5 tonnes)
                            </label>
                        </div>
                        <div class="col-12 col-sm-6">
                            <input type="radio" class="btn-check" name="vehicle_type" id="type_light" value="light">
                            <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_light">
                                Light (3.5 to 7.5 tonnes)
                            </label>
                        </div>
                        <div class="col-12 col-sm-6">
                            <input type="radio" class="btn-check" name="vehicle_type" id="type_medium" value="medium">
                            <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_medium">
                                Medium (7.5 to 18.5 tonnes)
                            </label>
                        </div>
                        <div class="col-12 col-sm-6">
                            <input type="radio" class="btn-check" name="vehicle_type" id="type_heavy" value="heavy">
                            <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_heavy">
                                Heavy (≥ 18.5 tonnes)
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Vehicle Number -->
                <div class="mb-3">
                    <label for="vehicle_no" class="form-label text-muted small fw-semibold">Vehicle Number</label>
                    <input type="text" class="form-control bg-light shadow-none" id="vehicle_no" name="vehicle_no" placeholder="Enter Vehicle Number" required>
                </div>
                
                <!-- Chassis Number -->
                <div class="mb-3">
                    <label for="chesis_no" class="form-label text-muted small fw-semibold">Chassis Number</label>
                    <input type="text" class="form-control bg-light shadow-none" id="chesis_no" name="chesis_no" placeholder="Enter Chassis Number" required>
                </div>

                <!-- Engine Number -->
                <div class="mb-4">
                    <label for="engine_no" class="form-label text-muted small fw-semibold">Engine Number</label>
                    <input type="text" class="form-control bg-light shadow-none" id="engine_no" name="engine_no" placeholder="Enter Engine Number" required>
                </div>
                
                <!-- File Upload Container -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold d-block">Vehicle Registration Certificate (PDF/DOCX)</label>
                    
                    <label for="certInput" class="border border-2 border-dashed rounded-3 p-4 text-center bg-light d-block cursor-pointer w-100" style="cursor: pointer;">
                        <div class="fs-2 mb-2">📄</div>
                        <div class="text-dark small mb-1">
                            <strong>Click to upload</strong> or drag and drop
                        </div>
                        <span class="d-block text-muted" style="font-size: 0.75rem;">PDF or DOCX only (Max 5MB)</span>
                        <span id="fileNameDisplay" class="d-block text-primary small mt-2 fw-semibold">No file chosen</span>
                    </label>
                    
                    <!-- Hidden or visually integrated file input -->
                    <input type="file" id="certInput" name="vehicle_rc" accept=".pdf, .docx" class="d-none" required>
                </div>
                
                <!-- Submit Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-3 shadow-sm">Register</button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="/static/js/tracker.js"></script>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
	const API_URL = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api"; 
	// Grab form and input elements
	const form = document.getElementById('vehicleRegistrationForm');
	function getAccessToken() { return localStorage.getItem('accessToken'); }
    function getRefreshToken() { return localStorage.getItem('refreshToken'); }

	
	form.addEventListener('submit', async function(event) {
		// 1. Prevent the default browser form submission (page reload)
		event.preventDefault();
		const form = event.target;
    
		// 🚀 Grabs vehicle_type, vehicle_no, chesis_no, engine_no, AND vehicle_rc automatically!
		const formData = new FormData(form);
		<!-- // 1. Manually extract text inputs using their element IDs -->
		<!-- const vehicleNoValue = document.getElementById('vehicle_no').value; -->
		<!-- const chesisNoValue = document.getElementById('chesis_no').value; -->
		<!-- const engineNoValue = document.getElementById('engine_no').value; -->

		<!-- // 2. Manually extract the selected Radio button value -->
		<!-- const selectedRadio = document.querySelector('input[name="vehicle_type"]:checked'); -->
		<!-- const vehicleTypeValue = selectedRadio ? selectedRadio.value : null; -->

		<!-- // 3. Manually extract the raw binary file instance -->
		<!-- const certInput = document.getElementById('certInput'); -->
		<!-- const certFile = certInput.files[0]; // Gets the first actual file object (not an array) -->

		<!-- // 🔍 Test Logs: Print manual values to inspect them in your browser console -->
		<!-- console.log("--- Manually Extracted Fields ---"); -->
		<!-- console.log("Vehicle Type:", vehicleTypeValue); -->
		<!-- console.log("Vehicle No:", vehicleNoValue); -->
		<!-- console.log("Chesis No:", chesisNoValue); -->
		<!-- console.log("Engine No:", engineNoValue); -->
		<!-- console.log("File Binary Object:", certFile); -->

		<!-- // 4. Manually construct the FormData payload for the API request -->
		<!-- const formData = new FormData(); -->
		
		<!-- // The keys added here MUST match your Django model/serializer field names exactly		 -->
		<!-- formData.append('vehicle_type', vehicleTypeValue); -->
		<!-- formData.append('vehicle_no', vehicleNoValue); -->
		<!-- formData.append('chesis_no', chesisNoValue); -->
		<!-- formData.append('engine_no', engineNoValue); -->
		
		
		
		
		<!-- // Append the file binary payload if it exists -->
		<!-- if (certFile) { -->
			<!-- formData.append('vehicle_rc', certFile); -->
		<!-- } -->
				
		// Send data via Fetch API
		try {
			const response = await fetch(`${API_URL}/vehicles/`, {
				method: 'POST',
				headers: {
					'Authorization': `Bearer ${getAccessToken()}`,
					<!-- 'Content-Type': 'application/json', -->
					'ngrok-skip-browser-warning': 'true' // <-- Add this exact line!
					// Optional: include authentication tokens or cross-site request forgery (CSRF) tokens here if required
				},
				body: formData // Send data as JSON string
			});

			// 6. Handle the server response
			if (response.ok) {
				const result = await response.json();
				form.reset(); // Clear the form fields
				alert('Vehicle added successful! Redirecting...');
				// Optional: Redirect the user to a dashboard or login page
				window.location.href = 'index.html';				
			} else {
				// Handle server-side errors (e.g., email already taken)
				const errorData = await response.json();
				alert(`Registration failed: ${errorData.message || 'Unknown error occurred.'}`);
			}
		} catch (error) {
			// Handle network errors or server downtime
			console.error('Network Error:', error);
			alert('A network error occurred. Please check your connection and try again.');
		}
	});
	
	document.getElementById('certInput').addEventListener('change', function(event) {
	  const fileDisplay = document.getElementById('fileNameDisplay');
	  
	  if (this.files && this.files.length > 0) {
		// Show the selected filename cleanly
		fileDisplay.innerText = `Selected: ${this.files[0].name}`;
		fileDisplay.style.color = '#10b981'; // Green active status indication
	  } else {
		fileDisplay.innerText = "No file chosen";
		fileDisplay.style.color = '#9ca3af';
	  }
	});
	
	document.addEventListener('DOMContentLoaded', () => {
			const token = localStorage.getItem('accessToken');
			const userRole = localStorage.getItem('userRole');
			const vehicleId = localStorage.getItem('driver_vehicle_id');

			if (token && vehicleId && userRole === 'driver') {
				startBackgroundDriverTracker();
			}
	});
	
	
</script>

</body>
</html>
