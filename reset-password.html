<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Fleet Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

    <div class="container" style="max-width: 420px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-sm-5">
            <h3 class="fw-bold text-dark mb-3 text-center">Set New Password</h3>
            
            <div id="resetMsg"></div>

            <form id="resetForm" onsubmit="submitNewPassword(event)">
                <div class="mb-3">
                    <label for="newPassword" class="form-label text-muted small fw-semibold">New Password</label>
                    <input type="password" id="newPassword" class="form-control bg-light shadow-none" placeholder="Enter new password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const token = urlParams.get('token');

        if (!uid || !token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('resetMsg').innerHTML = '<div class="alert alert-danger small">Invalid reset link. Please request a new one.</div>';
        }

        async function submitNewPassword(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value.trim();
            const msg = document.getElementById('resetMsg');

            try {
                const response = await fetch(`${API_BASE}/user_profiles/password-reset-link-confirm/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ uid: uid, token: token, new_password: newPassword })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Reset failed.");

                msg.innerHTML = `<div class="alert alert-success small">${data.message}</div>`;
                document.getElementById('resetForm').style.display = 'none';

                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } catch (err) {
                msg.innerHTML = `<div class="alert alert-danger small">${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
