<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Owner - Assign Vehicles to Drivers</title>
	<!-- Local Bootstrap Compiled CSS -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
	<!-- Local FontAwesome Icons -->
	<link href="static/css/all.min.css" rel="stylesheet">

</head>
<body class="bg-light">
	<div class="container py-4" style="max-width: 900px;">
        
        <!-- Back Button -->
        <a href="index.html" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>

        <!-- Main Card Container -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Header Section -->
                <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-user-gear text-primary me-2"></i>Assign Fleet Vehicles to Drivers</h3>
                <p class="text-muted small mb-4">Select a driver from the dropdown list to assign them to your fleet vehicles.</p>
                
                <!-- Message Container -->
                <div id="msg"></div>
                
                <!-- Dynamic Content Container -->
                <div id="fleet-container">
                    <div class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        <span>Loading fleet and drivers...</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle -->
	<script src="/static/js/bootstrap.bundle.min.js"></script>
	<script src="/static/js/tracker.js"></script>
    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";

        function getToken() {
            return localStorage.getItem('accessToken');
        }

        async function initPage() {
            const container = document.getElementById('fleet-container');
            const token = getToken();

            if (!token) {
                container.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Authentication token missing. Please log in as an owner.
                    </div>`;
                return;
            }

            try {
                // 1. Fetch Owner's Vehicles and Available Drivers concurrently
                const [vehiclesRes, usersRes, currUser] = await Promise.all([
                    fetch(`${API_BASE}/vehicles/`, { 
                        headers: { 
                            'Authorization': `Bearer ${token}`, 
                            'ngrok-skip-browser-warning': 'true'							
                        } 
                    }),
                    fetch(`${API_BASE}/users/`, { 
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'ngrok-skip-browser-warning': 'true'
                        } 
                    }),
                    fetch(`${API_BASE}/users/me/`, { 
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'ngrok-skip-browser-warning': 'true'
                        } 
                    })
                ]);

                if (!vehiclesRes.ok || !usersRes.ok || !currUser.ok) throw new Error("Failed to load required data.");

                const vehicles = await vehiclesRes.json();
                const users = await usersRes.json();
                const userData = await currUser.json();
                
                let myVehicles = vehicles.filter(v => v.user === userData.id && v.is_verified);
                
                console.log('vehicles', myVehicles);
                console.log('users', users);
                console.log("Current User Loaded:", userData);
                
                // Collect IDs of all drivers who are already assigned to ANY vehicle
                const drivers = users.filter(u => (u.profile?.role || u.role) === 'driver');
                const assignedDriverIds = new Set([
                    ...myVehicles.map(v => v.driver).filter(Boolean),
                    ...drivers.filter(d => d.assigned_vehicle != null).map(d => d.id)
                ]);

                if (!myVehicles || myVehicles.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-4 text-muted border border-dashed rounded-3 bg-light">
                            <i class="fa-solid fa-truck fs-3 mb-2"></i>
                            <p class="mb-0 small">You have no registered vehicles in your fleet.</p>
                        </div>`;
                    return;
                }

                // 2. Render vehicles list with assignment controls
                container.innerHTML = '';
                myVehicles.forEach(vehicle => {
                    console.log(vehicle);
                    const row = document.createElement('div');
                    row.className = 'card mb-3 border shadow-sm rounded-3';
					const hasActiveOrder = vehicle.current_customer !== null;
					console.log(hasActiveOrder);
                    
					// Build driver options dropdown
                    let driverOptions = '<option value="">-- Unassigned --</option>';
                    drivers.forEach(driver => {
                        const isAssignedElsewhere = assignedDriverIds.has(driver.id) && vehicle.driver !== driver.id;
                        if (!isAssignedElsewhere) {
                            const isSelected = vehicle.driver === driver.id ? 'selected' : '';
                            driverOptions += `<option value="${driver.id}" ${isSelected}>${driver.username} (${driver.first_name || 'Driver'})</option>`;
                        }
                    });
                    
                    row.innerHTML = `
                        <div class="card-body p-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                            <div class="vehicle-info">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <h5 class="fw-bold text-dark mb-0">${vehicle.vehicle_no}</h5>
                                    <span class="badge bg-secondary text-uppercase" style="font-size: 0.65rem;">${vehicle.vehicle_type}</span>
                                </div>
                                <p class="mb-1 small text-muted"><strong>Chassis:</strong> ${vehicle.chesis_no}</p>
                                <p class="mb-0 small text-muted"><strong>Current Status:</strong> <span class="badge bg-success-subtle text-success border border-success-subtle" id="current-driver-${vehicle.id}">${vehicle.driver ? 'Assigned' : 'Unassigned'}</span></p>
                            </div>
                            <div class="assignment-controls d-flex align-items-center gap-2">
                                <select id="driver-select-${vehicle.id}" class="form-select form-select-sm shadow-none" style="min-width: 200px;" ${hasActiveOrder ? 'disabled' : ''}>
                                    ${driverOptions}
                                </select>
                                <button onclick="assignDriver(${vehicle.id})" class="btn btn-primary btn-sm fw-semibold text-nowrap px-3">Save</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${err.message}
                    </div>`;
            }
        }

        // 3. Send assignment PATCH request to backend
        async function assignDriver(vehicleId) {
            const msg = document.getElementById('msg');
            const selectEl = document.getElementById(`driver-select-${vehicleId}`);
            const driverId = selectEl.value ? parseInt(selectEl.value) : null;
            const token = getToken();
			
            msg.innerText = "Updating assignment...";
            msg.className = "";

            try {
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true' // <-- Add this exact line! 
                    },
                    body: JSON.stringify({ driver: driverId }) // Updates the driver foreign key on the vehicle model
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || "Failed to assign driver. Verify if the driver has been assigned to a different vehicle.");

                msg.innerText = `Success! Vehicle #${vehicleId} driver assignment updated.`;
                msg.className = "success";

            } catch (err) {
                console.error(err);
                msg.innerText = `Error: ${err.message}`;
                msg.className = "error";
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
		document.addEventListener('DOMContentLoaded', () => {
			const token = localStorage.getItem('accessToken');
			const userRole = localStorage.getItem('userRole');
			const vehicleId = localStorage.getItem('driver_vehicle_id');

			if (token && vehicleId && userRole === 'driver') {
				startBackgroundDriverTracker();
			}
		});
    </script>
</body>
</html>
