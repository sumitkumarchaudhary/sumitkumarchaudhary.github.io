<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Subscription Management</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: system-ui, sans-serif; 
            background: #f4f6f9; 
            padding: 10px; 
            color: #1e293b; 
            margin: 0;
        }
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            max-width: 800px; 
            margin: auto; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            width: 100%;
        }
        h2 { font-size: 1.25rem; margin-top: 0; }
        #msg { margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 14px; }

        /* Mobile-First Card View for Users */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .user-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .user-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .user-actions button {
            flex: 1;
        }

        button { 
            padding: 8px 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            color: white; 
            font-size: 13px;
        }
        .btn-activate { background: #10b981; }
        .btn-revoke { background: #ef4444; }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            pointer-events: none;
        }

        /* Desktop Table View (Hidden on mobile, shown on wider screens) */
        .desktop-table { display: none; }
        .mobile-cards { display: block; }

        @media (min-width: 768px) {
            body { padding: 20px; }
            .card { padding: 20px; }
            h2 { font-size: 1.5rem; }
            
            .mobile-cards { display: none; }
            .desktop-table { display: block; width: 100%; overflow-x: auto; }
            table { width: 100%; border-collapse: collapse; }
            th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
            .user-actions button { flex: unset; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛠️ Admin Portal: User Subscriptions</h2>
        <div id="msg"></div>
        <div id="users-table-container">Loading users...</div>
    </div>

    <script>
        const API_BASE = 'https://upheaval-revise-fit.ngrok-free.dev/etransport/api';
        const token = localStorage.getItem('accessToken');

        async function fetchAllUsers() {
            const container = document.getElementById('users-table-container');
            try {
                const response = await fetch(`${API_BASE}/users/`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!response.ok) throw new Error("Failed to load user profiles. Ensure you are logged in as staff.");

                const data = await response.json();
				const users = data.filter(u => u.role !== 'admin');
                if (users.length === 0) {
                    container.innerHTML = '<p>No users found.</p>';
                    return;
                }
				
                console.log(users);
                
                container.innerHTML = `
                    <!-- Mobile Card View -->
					<div class="mobile-cards">
						<div class="user-list">
							${users.map(u => {
								const isSubscribed = u.profile && u.profile.is_subscribed;
								const hasProfile = !!u.profile;
								
								let statusHtml = '<span style="color: #64748b;">Inactive</span>';
								if (hasProfile && isSubscribed) {
									let endDateStr = '';
									if (u.profile.subscription_end_date) {
										const dateObj = new Date(u.profile.subscription_end_date);
										endDateStr = ` (Active till: ${dateObj.toLocaleDateString()})`;
									}
									statusHtml = `<span style="color: #10b981; font-weight: bold;">Active${endDateStr}</span>`;
								} else if (!hasProfile) {
									statusHtml = '<span style="color: #64748b;">No profile</span>';
								}

								return `
									<div class="user-item">
										<div class="user-info-row">
											<strong>${u.first_name} ${u.last_name}</strong>
											<span style="font-size: 12px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">${u.role}</span>
										</div>
										<div class="user-info-row">
											<span>Status:</span>
											<span>${statusHtml}</span>
										</div>
										<div class="user-actions" style="display: flex; gap: 6px; align-items: center; margin-top: 8px;">
											<input type="number" id="mobile-custom-days-${u.id}" value="30" min="1" max="365" style="width: 60px; padding: 8px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px;" placeholder="Days" ${!hasProfile ? 'disabled' : ''}>
											<button class="btn-activate" onclick="modifySubscription(${u.id}, 'activate')" ${!hasProfile ? 'disabled' : ''}>Extend</button>
											<button class="btn-revoke" onclick="modifySubscription(${u.id}, 'revoke')" ${!hasProfile ? 'disabled' : ''}>Revoke</button>
										</div>
									</div>
								`;
							}).join('')}
						</div>
					</div>
                    

                    <!-- Desktop Table View -->
                    <div class="desktop-table">
                        <table>
                            <thead>
                                <tr>
                                    <!-- <th>User Id</th> -->
                                    <th>Name</th>
                                    <th>Role</th>
									<th>Email Verified?</th>
									<th>Phone Verified?</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
							<tbody>
                                ${users.map(u => {
                                    let statusHtml = '<span style="color: #64748b;">Inactive</span>';
                                    if (u.profile && u.profile.is_subscribed) {
                                        let endDateStr = '';
                                        if (u.profile.subscription_end_date) {
                                            const dateObj = new Date(u.profile.subscription_end_date);
                                            endDateStr = `<br><small style="color: #475569;">Active till: ${dateObj.toLocaleDateString()}</small>`;
                                        }
                                        statusHtml = `<span style="color: #10b981; font-weight: bold;">Active</span>${endDateStr}`;
                                    }

                                    return `
                                        <tr>
                                            <!-- <td>${u.id}</td> -->
                                            <td>${u.first_name} ${u.last_name}</td>
                                            <td>${u.role}</td>
											
                                            ${u.profile ? `
												<td>${u.profile.email_verified}</td>
												<td>${u.profile.phone_verified}</td>
                                                <td>${statusHtml}</td>
                                                <td style="display: flex; gap: 6px; align-items: center;">
                                                    <input type="number" id="custom-days-${u.id}" value="30" min="1" max="365" style="width: 60px; padding: 8px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px;" placeholder="Days">
                                                    <button class="btn-activate" onclick="modifySubscription(${u.id}, 'activate')">Extend</button>
                                                    <button class="btn-revoke" onclick="modifySubscription(${u.id}, 'revoke')">Revoke</button>
                                                </td>
                                            ` : `
												<td>null</td>
												<td>null</td>
                                                <td><span style="color: #64748b;">No profile</span></td>
                                                <td>
                                                    <input type="number" id="custom-days-${u.id}" value="30" min="1" max="365" style="width: 60px; padding: 8px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px;" placeholder="Days" disabled>
                                                    <button class="btn-activate" disabled>Extend</button>
                                                    <button class="btn-revoke" disabled>Revoke</button>
                                                </td>
                                            `}
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
            }
        }

        async function modifySubscription(userId, actionType) {
            const msg = document.getElementById('msg');
            msg.innerText = `Processing ${actionType}...`;
            msg.style.color = "#007BFF";
			const daysInput = document.getElementById(`custom-days-${userId}`);
			const days = parseInt(daysInput.value);

			if (!days || days <= 0) {
				alert("Please enter a valid number of days.");
				return;
			}
			const token = localStorage.getItem('accessToken');

            try {
                const response = await fetch(`${API_BASE}/user_profiles/${userId}/manage_subscription/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ action_type: actionType, days: days })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Action failed.");

                msg.innerText = data.message;
                msg.style.color = "green";
                fetchAllUsers();
            } catch (err) {
                msg.innerText = `Error: ${err.message}`;
                msg.style.color = "red";
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAllUsers);
    </script>
</body>
</html>
