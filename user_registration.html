<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - Fleet Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 650px;">
        
        <!-- Main Card Container -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Header Section -->
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; min-width: 50px; font-size: 1.25rem;">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold text-dark mb-0">Create an Account</h3>
                        <p class="text-muted small mb-0">Join the transport and logistics fleet management portal.</p>
                    </div>
                </div>

                <!-- Registration Form -->
                <form id="registrationForm" novalidate>
                    
                    <!-- User Type Selection -->
                    <div class="mb-3">
                        <label for="role" class="form-label text-muted small fw-semibold">User Type</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user-tag"></i></span>
                            <select id="role" name="role" class="form-select bg-light border-start-0 ps-0 shadow-none" required>
                                <option value="" disabled selected>Select User Type</option>
                                <option value="customer">End Customer</option>
                                <option value="driver">Driver</option>
                                <option value="owner">Vehicle Owner</option>
                            </select>
                        </div>
                    </div>

                    <!-- First Name & Last Name Row -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="first_name" class="form-label text-muted small fw-semibold">First Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                                <input type="text" id="first_name" name="first_name" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="John" required>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="last_name" class="form-label text-muted small fw-semibold">Last Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                                <input type="text" id="last_name" name="last_name" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Doe" required>
                            </div>
                        </div>
                    </div>

                    <!-- Email & Phone Row -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="phone" class="form-label text-muted small fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-phone"></i></span>
                                <input type="tel" id="phone" name="phone" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="+1 (123) 456-7890" required>
                            </div>
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-at"></i></span>
                            <input type="text" id="username" name="username" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <!-- Password & Confirm Password Row -->
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="password" name="password" minlength="8" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="At least 8 characters" required>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="confirmPassword" class="form-label text-muted small fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Repeat password" required>
                            </div>
                            <div id="passwordError" class="error-message">Passwords do not match.</div>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input shadow-none" id="terms" name="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the <a href="#" class="text-primary text-decoration-none fw-semibold">Terms of Service</a> and <a href="#" class="text-primary text-decoration-none fw-semibold">Privacy Policy</a>.
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-3 shadow-sm">
                            <i class="fa-solid fa-user-check me-1"></i> Register Account
                        </button>
                    </div>

                    <!-- Footer Link -->
                    <div class="text-center small text-muted">
                        Already have an account? <a href="index.html" class="text-primary text-decoration-none fw-semibold">Sign In</a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api"; 
        
        const form = document.getElementById('registrationForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const passwordError = document.getElementById('passwordError');

        form.addEventListener('submit', async function(event) {
            // 1. Prevent default browser form submission
            event.preventDefault();

            // 2. Clear previous error states
            passwordError.style.display = 'none';
            confirmPassword.classList.remove('is-invalid');

            // 3. Client-side password verification
            if (password.value !== confirmPassword.value) {
                passwordError.style.display = 'block';
                confirmPassword.classList.add('is-invalid');
                confirmPassword.focus();
                return;
            }

            // 4. Gather form data automatically & construct payload
            const formData = new FormData(form);
            const formProps = Object.fromEntries(formData);
            
            const payload = {
                username: formProps.username,
                email: formProps.email,
                password: formProps.password,
                first_name: formProps.first_name,
                last_name: formProps.last_name,
                profile: {
                    role: formProps.role,
                    phone_number: formProps.phone 
                }
            };

            // 5. Send data via Fetch API
            try {
                const response = await fetch(`${API_URL}/users/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(payload)
                });

                // 6. Handle server response
                if (response.ok) {
                    const result = await response.json();
                    form.reset();
                    alert('Registration successful! Redirecting...');
                    window.location.href = 'index.html';                
                } else {
                    const errorData = await response.json();
                    alert(`Registration failed: ${errorData.message || JSON.stringify(errorData) || 'Unknown error occurred.'}`);
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('A network error occurred. Please check your connection and try again.');
            }
        });

        // Real-time matching feedback as user types
        confirmPassword.addEventListener('input', function() {
            if (password.value === confirmPassword.value) {
                passwordError.style.display = 'none';
                confirmPassword.classList.remove('is-invalid');
                confirmPassword.classList.add('is-valid');
            } else {
                confirmPassword.classList.remove('is-valid');
                confirmPassword.classList.add('is-invalid');
            }
        });
    </script>
</body>
</html>
