            <!-- Additional Timeline / Activity Info -->
            <div class="p-3 bg-light rounded-3 border-start border-primary border-4">

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        
        // Extract order ID from URL query parameters (e.g., order-details.html?id=12)
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        function formatDateTime(isoString) {
            if (!isoString) return 'Not available';
            const dateObj = new Date(isoString);
            if (isNaN(dateObj.getTime()) || dateObj.getFullYear() <= 1970) return 'Not available';
            return dateObj.toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        async function fetchOrderDetails() {
            if (!orderId) {
                alert("No Order ID specified in URL.");
                window.location.href = 'dashboard.html';
                return;
            }

            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to load order details from server.");

                const order = await response.json();
				console.log(order);
                // Populate Header & Badges
                document.getElementById('pageTitle').textContent = `Order #${order.id}`;
                document.getElementById('orderIdBadge').textContent = `ID: #${order.id}`;
                document.getElementById('orderCreatedDate').textContent = `Created on: ${formatDateTime(order.created_at)}`;
                
                // Status Badge styling
                const statusBadge = document.getElementById('orderStatusBadge');
                statusBadge.textContent = order.status ? order.status.toUpperCase() : 'PENDING';
                statusBadge.className = `badge px-3 py-2 ${order.status === 'completed' ? 'bg-success' : 'bg-warning text-dark'}`;

                // Meta fields
                document.getElementById('orderWeight').textContent = `${parseFloat(order.material_weight || 0).toLocaleString()} kg`;
                document.getElementById('orderVehicle').textContent = order.vehicle_no || `Vehicle ID: ${order.vehicle || 'N/A'}`;
                document.getElementById('orderCompletedDate').textContent = order.completed_at ? `Completed on: ${formatDateTime(order.completed_at)}` : 'In progress / Pending dispatch';

                <!-- // Populate Materials Table -->
                <!-- const tbody = document.getElementById('materialsTableBody'); -->
                <!-- tbody.innerHTML = ''; -->

                <!-- if (order.items && order.items.length > 0) { -->
                    <!-- order.items.forEach(item => { -->
                        <!-- const tr = document.createElement('tr'); -->
                        <!-- tr.innerHTML = ` -->
                            <!-- <td class="ps-3 fw-semibold text-dark">${item.material_name || 'Material #' + item.material}</td> -->
                            <!-- <td>${item.quantity}</td> -->
                            <!-- <td class="pe-3 text-end text-muted">${item.unit || 'kg'}</td> -->
                        <!-- `; -->
                        <!-- tbody.appendChild(tr); -->
                    <!-- }); -->
                <!-- } else { -->
                    <!-- tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-3">No individual material breakdown recorded. (${order.materials_summary || 'Summary unavailable'})</td></tr>`; -->
                <!-- } -->

            } catch (err) {
                console.error("Error fetching order details:", err);
                alert(err.message || "Could not load order details.");
            }
        }

        document.addEventListener('DOMContentLoaded', fetchOrderDetails);
    </script>
