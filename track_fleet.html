<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Tracking Overview</title>
    <!-- Local Bootstrap Compiled CSS -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
	<!-- Local FontAwesome Icons -->
	<link href="static/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4" style="max-width: 900px;">
        
        <!-- Back Button -->
        <a href="index.html" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>

        <!-- Main Card Container -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Header Section -->
                <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-map-location-dot text-primary me-2"></i>Fleet Tracking Overview</h3>
                <p class="text-muted small mb-4">Monitor real-time locations and access past telemetry trails for all registered vehicles.</p>
                
                <!-- Fleet Dynamic Container -->
                <div id="fleet-container">
                    <div class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        <span>Loading your fleet data...</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
	<script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";

        function getAccessToken() {
            return localStorage.getItem('accessToken');
        }

        async function fetchFleetVehicles() {
            const container = document.getElementById('fleet-container');
            const token = getAccessToken();

            if (!token) {
                container.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Authentication token not found. Please log in.
                    </div>`;
                return;
            }

            try {
                // Fetch all vehicles owned by the logged-in owner
                const response = await fetch(`${API_BASE}/vehicles/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true' 		
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load fleet (Status: ${response.status})`);
                }

                const vehicles = await response.json();
                console.log(vehicles);

                if (vehicles && vehicles.length > 0) {
                    container.innerHTML = '<div class="row g-3" id="fleet-grid"></div>';
                    const grid = container.querySelector('#fleet-grid');

                    vehicles.forEach(vehicle => {
                        const col = document.createElement('div');
                        col.className = 'col-12 col-md-6';

                        let actionButtons = '';
                        if (vehicle.currlat && vehicle.currlon) {
                            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${vehicle.currlat},${vehicle.currlon}`;
                            actionButtons += `
                                <a href="${mapUrl}" target="_blank" class="btn btn-primary btn-sm fw-semibold text-decoration-none flex-grow-1">
                                    <i class="fa-solid fa-location-dot me-1"></i> Live Map
                                </a>`;
                        } else {
                            actionButtons += `
                                <span class="text-muted small align-self-center flex-grow-1 text-center py-1 bg-light rounded border border-dashed" style="font-size: 0.75rem;">
                                    <i class="fa-solid fa-triangle-exclamation text-warning me-1"></i> No GPS fix
                                </span>`;
                        }

                        actionButtons += `
                            <a href="vehicle_history.html?id=${vehicle.id}" class="btn btn-outline-secondary btn-sm fw-semibold text-decoration-none flex-grow-1">
                                <i class="fa-solid fa-clock-rotate-left me-1"></i> History Trail
                            </a>`;

                        col.innerHTML = `
                            <div class="card h-100 border shadow-sm rounded-3">
                                <div class="card-body p-3 d-flex flex-column justify-content-between">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h5 class="fw-bold text-dark mb-0">${vehicle.vehicle_no}</h5>
                                            <span class="badge bg-secondary text-uppercase" style="font-size: 0.65rem;">${vehicle.vehicle_type_description || 'Vehicle'}</span>
                                        </div>
                                        
                                        <div class="row g-2 bg-light p-2 rounded-3 border mb-3 small">
                                            <div class="col-6">
                                                <span class="text-muted d-block" style="font-size: 0.65rem;">DRIVER</span>
                                                <span class="fw-semibold">${vehicle.driver_first_name || 'N/A'} ${vehicle.driver_last_name || ''}</span>
                                            </div>
                                            <div class="col-6">
                                                <span class="text-muted d-block" style="font-size: 0.65rem;">COORDINATES</span>
                                                <span class="fw-semibold text-truncate d-block">${vehicle.currlat ? vehicle.currlat.toFixed(4) + ', ' + vehicle.currlon.toFixed(4) : 'N/A'}</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex gap-2 pt-2 border-top">
                                        ${actionButtons}
                                    </div>
                                </div>
                            </div>
                        `;
                        grid.appendChild(col);
                    });
                } else {
                    container.innerHTML = `
                        <div class="text-center py-4 text-muted border border-dashed rounded-3 bg-light">
                            <i class="fa-solid fa-truck-fast fs-3 mb-2"></i>
                            <p class="mb-0 small">No vehicles found in your fleet.</p>
                        </div>`;
                }

            } catch (error) {
                console.error('Error fetching fleet:', error);
                container.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${error.message}
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchFleetVehicles);
    </script>
</body>
</html>
