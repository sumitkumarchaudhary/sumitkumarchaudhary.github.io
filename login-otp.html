<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login With OTP - Fleet Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container" style="max-width: 420px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-sm-5">
            
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <h3 class="fw-bold text-dark">Phone OTP Login</h3>
                <p class="text-muted small mb-0">Sign in securely using your mobile number.</p>
            </div>

            <!-- Feedback Message Box -->
            <div id="loginMsg"></div>

            <!-- Step 1: Phone Number Input Form -->
            <div id="phoneStep">
                <div class="mb-3">
                    <label for="phoneNumber" class="form-label text-muted small fw-semibold">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-phone"></i></span>
                        <input type="text" id="phoneNumber" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Enter mobile number" required>
                    </div>
                </div>
                <button type="button" class="btn btn-primary w-100 fw-semibold py-2" onclick="requestOtp()">Send OTP</button>
				<div class="text-center mt-3">
					<a href="index.html" class="text-decoration-none small fw-semibold text-muted">
						<i class="fa-solid fa-key me-1"></i> Login with Username & Password instead
					</a>
				</div>
            </div>

            <!-- Step 2: OTP Entry Form (Hidden Initially) -->
            <div id="otpStep" style="display: none;">
                <div class="mb-3 text-center">
                    <label for="otpCode" class="form-label text-muted small fw-semibold d-block">Enter 6-Digit OTP</label>
                    <input type="text" id="otpCode" class="form-control bg-light text-center fs-3 tracking-widest shadow-none" maxlength="6" placeholder="------">
                </div>
                <button type="button" class="btn btn-success w-100 fw-semibold py-2" onclick="verifyOtp()">Verify & Login</button>
                <div class="text-center mt-3">
                    <button type="button" class="btn btn-link btn-sm text-muted text-decoration-none" onclick="resetLoginFlow()">Change Phone Number</button>
                </div>
				<a href="login.html" class="text-decoration-none small fw-semibold text-primary">Password Login</a>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        let currentPhone = "";

        async function requestOtp() {
            const phoneInput = document.getElementById('phoneNumber');
            const msg = document.getElementById('loginMsg');
            currentPhone = phoneInput.value.trim();

            if (!currentPhone || currentPhone.length < 10) {
                msg.innerHTML = '<div class="alert alert-danger py-2 small" role="alert">Please enter a valid mobile number.</div>';
                return;
            }

            try {
                msg.innerHTML = '<div class="alert alert-info py-2 small" role="alert"><span class="spinner-border spinner-border-sm me-1"></span> Sending OTP...</div>';

                const response = await fetch(`${API_BASE}/user_profiles/request-login-otp/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ phone_number: currentPhone })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to request OTP.");

                msg.innerHTML = `<div class="alert alert-success py-2 small" role="alert">${data.message}</div>`;
                
                // Switch to OTP view
                document.getElementById('phoneStep').style.display = 'none';
                document.getElementById('otpStep').style.display = 'block';
            } catch (err) {
                msg.innerHTML = `<div class="alert alert-danger py-2 small" role="alert">${err.message}</div>`;
            }
        }

        async function verifyOtp() {
			const phoneInput = document.getElementById('phoneNumber');
            const otpInput = document.getElementById('otpCode');
            const msg = document.getElementById('loginMsg');
            const otp = otpInput.value.trim();
			currentPhone = phoneInput.value.trim();
            if (!otp || otp.length !== 6) {
                msg.innerHTML = '<div class="alert alert-danger py-2 small" role="alert">Please enter the complete 6-digit OTP.</div>';
                return;
            }

            try {
                msg.innerHTML = '<div class="alert alert-info py-2 small" role="alert"><span class="spinner-border spinner-border-sm me-1"></span> Verifying...</div>';

                const response = await fetch(`${API_BASE}/user_profiles/verify-login-otp/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ phone_number: currentPhone, otp: otp })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Invalid OTP.");

                // Store tokens and user role in localStorage
                localStorage.setItem('accessToken', data.access);
                localStorage.setItem('refreshToken', data.refresh);
                <!-- localStorage.setItem('userRole', data.user.role); -->

                msg.innerHTML = '<div class="alert alert-success py-2 small" role="alert">Login successful! Redirecting...</div>';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (err) {
                msg.innerHTML = `<div class="alert alert-danger py-2 small" role="alert">${err.message}</div>`;
            }
        }

        function resetLoginFlow() {
            document.getElementById('otpStep').style.display = 'none';
            document.getElementById('phoneStep').style.display = 'block';
            document.getElementById('loginMsg').innerHTML = '';
            document.getElementById('otpCode').value = '';
        }
    </script>
</body>
</html>
