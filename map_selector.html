<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Location on Map</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        #map {
            flex-grow: 1;
            width: 100%;
            z-index: 1;
        }
        /* Floating Modern Control Bar */
        .control-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <!-- Control Header Bar -->
    <div class="control-bar py-3 px-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center text-secondary small" id="instruction-wrapper">
            <i class="fa-solid fa-map-pin text-primary fs-5 me-2 animate-bounce"></i>
            <span id="instruction" class="fw-medium text-dark fst-italic">Click anywhere on the map or use your current location...</span>
        </div>
        <div class="d-flex align-items-center gap-2 w-100 w-md-auto justify-content-end">
            <button id="gps-btn" onclick="panToCurrentLocation()" class="btn btn-outline-primary btn-sm fw-semibold text-nowrap py-2 px-3 rounded-3 shadow-sm">
                <i class="fa-solid fa-crosshairs me-1"></i> Current Location
            </button>
            <button id="confirm-btn" disabled onclick="confirmLocation()" class="btn btn-primary btn-sm fw-semibold text-nowrap py-2 px-3 rounded-3 shadow-sm">
                <i class="fa-solid fa-check me-1"></i> Confirm Location
            </button>
        </div>
    </div>
    
    <!-- Map Viewport -->
    <div id="map"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetType = urlParams.get('type') || 'pickup';

        const map = L.map('map').setView([20.5937, 78.9629], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            crossOrigin: true,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedLat = null;
        let selectedLon = null;
        let selectedAddress = "";
        let marker;

        // Function to handle reverse geocoding for any lat/lon
        async function selectCoordinates(lat, lon, zoomLevel = 18) {
            selectedLat = lat;
            selectedLon = lon;
            
            const instruction = document.getElementById('instruction');
            const confirmBtn = document.getElementById('confirm-btn');

            instruction.className = "text-muted fw-medium fst-italic";
            instruction.innerHTML = `<span class="spinner-border spinner-border-sm text-primary me-2" role="status"></span> Resolving address from coordinates...`;

            map.setView([selectedLat, selectedLon], zoomLevel);

            if (marker) {
                marker.setLatLng([selectedLat, selectedLon]);
            } else {
                marker = L.marker([selectedLat, selectedLon]).addTo(map);
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${selectedLat}&lon=${selectedLon}&zoom=18`, {
                    headers: { 'Accept-Language': 'en', 'User-Agent': 'eTransportApp/1.0' }
                });
                
                if (!res.ok) throw new Error("Failed to fetch address.");

                const data = await res.json();
                selectedAddress = data.display_name || `${selectedLat}, ${selectedLon}`;
                
                instruction.className = "text-dark fw-semibold";
                instruction.innerHTML = `<b>Selected:</b> ${selectedAddress}`;
                confirmBtn.disabled = false;

                marker.bindPopup(`<b>Pinned Location:</b><br><span style="font-size:11px;">${selectedAddress}</span>`).openPopup();
            } catch (err) {
                console.error("Geocoding error:", err);
                selectedAddress = `${selectedLat}, ${selectedLon}`;
                instruction.className = "text-dark fw-semibold";
                instruction.innerHTML = `<b>Selected Coordinates:</b> ${selectedAddress}`;
                confirmBtn.disabled = false;
            }
        }

        // Map Click Event Listener
        map.on('click', function(e) {
            selectCoordinates(e.latlng.lat, e.latlng.lng);
        });

        // Geolocation handler for the "My Location" button
        function panToCurrentLocation() {
            const instruction = document.getElementById('instruction');
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            instruction.className = "text-muted fw-medium fst-italic";
            instruction.innerHTML = `<span class="spinner-border spinner-border-sm text-primary me-2" role="status"></span> Detecting your current location...`;

            navigator.geolocation.getCurrentPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    selectCoordinates(lat, lon, 16);
                },
                error => {
                    console.error(error);
                    instruction.className = "text-danger fw-medium";
                    instruction.textContent = "Unable to retrieve your location. Please check browser permissions.";
                    alert("Unable to retrieve your location. Please check browser permissions.");
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        // Pass data back to parent window and close popup
        function confirmLocation() {
            if (selectedLat !== null && selectedLon !== null && window.opener) {
                window.opener.setSelectedLocation(targetType, selectedLat, selectedLon, selectedAddress);
                window.close();
            } else {
                alert("Please select a location on the map first.");
            }
        }
    </script>
</body>
</html>
