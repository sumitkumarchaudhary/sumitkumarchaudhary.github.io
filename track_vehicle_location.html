<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<!-- Leaflet Routing Machine CSS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <title>Vehicle History Trail</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        h2 { color: #4f46e5; margin-bottom: 1rem; }
        .back-btn { display: inline-block; margin-bottom: 1.5rem; color: #4f46e5; text-decoration: none; font-weight: 600; }
        .back-btn:hover { text-decoration: underline; }
        .history-item, .order-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        .loading { font-style: italic; color: #64748b; }
        .error { color: #ef4444; font-weight: bold; }
		
    </style>
	<style>
        #map { height: 300px; width: 100%; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Dashboard</a>
	
    <div class="card">
        <h2 id="vehicle-title">Live Vehicle Location</h2>
		<div id="map"></div>
        <!-- <div id="content-area" class="loading">Loading vehicle history data...</div> -->
    </div>
   
	
	<!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<!-- Leaflet Routing Machine JS -->
	<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

	<script src="/static/js/tracker.js"></script>
    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        
        // Extract vehicle ID from URL query parameters (e.g., vehicle_history.html?id=3)
        const urlParams = new URLSearchParams(window.location.search);
        const vehicleId = urlParams.get('id');
		const dest_lat = parseFloat(urlParams.get('destination_lat'));
		const dest_lon = parseFloat(urlParams.get('destination_lon'));
		
		
        function getAccessToken() {
            return localStorage.getItem('accessToken');
        }
		
		// 1. Initialize the map
        const map = L.map('map').setView([28.5355, 77.3910], 13); // Default center (e.g., Noida)
        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

		let vehicleMarker = null;
		let routeControl = null;
		// Function to fetch latest coordinates and update the map marker
        async function fetchVehicleLiveLocation() {
            const token = localStorage.getItem('accessToken');
            
            try {
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/location/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch location");

                const data = await response.json();
				// 1. Render Coordinate History Trail
                if (data.lat && data.lon ) {
					const latLng = [data.lat, data.lon];

                    if (vehicleMarker) {
                        // 🚀 Smoothly update existing marker position without re-centering map forcibly
                        vehicleMarker.setLatLng(latLng);
                    } else {
                        // Create marker on first load and center map on it
                        vehicleMarker = L.marker(latLng).addTo(map)
                            .bindPopup("<b>Live Driver Location</b>").openPopup();
                        map.setView(latLng, 15);
                    }
					
					// Remove existing route if updating
					if (routeControl) {
						map.removeControl(routeControl);
					}
					routeControl = L.Routing.control({
						waypoints: [
							L.latLng(data.lat, data.lon), // e.g., Driver location
							L.latLng(dest_lat, dest_lon)       // e.g., Destination / Order location
						],
						routeWhileDragging: false,
						addWaypoints: false,
						draggableWaypoints: false,
						fitSelectedRoutes: true,
						show: false // Hides the default text instruction panel if you only want the map line
					}).addTo(map);
						
				}
				
            } catch (err) {
                console.error("Unable to fetch location:", err);
            }
        }
		
		
		function displayRouteOnMap(startLat, startLon, endLat, endLon) {
			// Remove existing route if updating
			if (routeControl) {
				map.removeControl(routeControl);
			}

			routeControl = L.Routing.control({
				waypoints: [
					L.latLng(startLat, startLon), // e.g., Driver location
					L.latLng(endLat, endLon)       // e.g., Destination / Order location
				],
				routeWhileDragging: false,
				addWaypoints: false,
				draggableWaypoints: false,
				fitSelectedRoutes: true,
				show: false // Hides the default text instruction panel if you only want the map line
			}).addTo(map);
		}

// Example usage: Draw route from driver to customer order
// displayRouteOnMap(28.6139, 77.2090, 28.5355, 77.3910);
		
		
	
        document.addEventListener('DOMContentLoaded', fetchVehicleLiveLocation);
		setInterval(fetchVehicleLiveLocation, 5000);
    </script>
</body>
</html>
