<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Order Tracking & Driver Details</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b;
        }
        #map { 
            height: 450px; 
            width: 100%; 
            border-radius: 0.5rem;
            z-index: 1;
        }
        /* Hide Leaflet Routing Machine default instruction text box panel */
        .leaflet-routing-container {
            display: none !important;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4" style="max-width: 950px;">
        
        <!-- Back Button -->
        <a onclick="history.back()" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
        </a>

        <!-- Main Card Container -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Header Section -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; min-width: 50px; font-size: 1.25rem;">
                            <i class="fa-solid fa-location-crosshairs"></i>
                        </div>
                        <div>
                            <h3 id="vehicle-title" class="fw-bold text-dark mb-0">Live Shipment & Driver Tracking</h3>
                            <p class="text-muted small mb-0">Real-time GPS telemetry, order progress, and assigned driver contact details.</p>
                        </div>
                    </div>
                    
                    <!-- Live Status Indicator Badge -->
                    <div class="d-flex align-items-center bg-success bg-opacity-10 text-success border border-success-subtle px-3 py-1.5 rounded-pill small fw-semibold">
                        <span class="spinner-grow spinner-grow-sm me-2 text-success" role="status"></span> Live Tracking Active
                    </div>
                </div>

                <!-- Active Order & Driver Summary Box -->
                <div id="order-summary-box" class="card border border-light bg-light shadow-sm rounded-3 mb-4">
                    <div class="card-body p-3">
                        <div class="text-center text-muted py-2 small">
                            <span class="spinner-border spinner-border-sm me-2" role="status"></span> Loading shipment and driver details...
                        </div>
                    </div>
                </div>

                <!-- Leaflet Map Container -->
                <div id="map" class="border shadow-sm"></div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="/static/js/tracker.js"></script>

    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        
        const urlParams = new URLSearchParams(window.location.search);
        const vehicleId = urlParams.get('id');
        let dest_lat = parseFloat(urlParams.get('destination_lat'));
        let dest_lon = parseFloat(urlParams.get('destination_lon'));
        
        function getAccessToken() {
            return localStorage.getItem('accessToken');
        }
        
        // Initialize the map
        const map = L.map('map').setView([28.5355, 77.3910], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let vehicleMarker = null;
        let routeControl = null;

        // Fetch active order information including assigned driver details
        async function fetchActiveOrderContext() {
            const token = getAccessToken();
            const summaryBox = document.getElementById('order-summary-box');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/orders/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
                if (!response.ok) return;

                const orders = await response.json();
                const activeOrder = orders.find(o => (o.vehicle == vehicleId || (!isNaN(vehicleId) && o.vehicle == null)) && o.status !== 'delivered' && o.status !== 'cancelled') || orders[0];

                if (activeOrder) {
                    if (isNaN(dest_lat) || isNaN(dest_lon)) {
                        if (activeOrder.status === 'assigned' && activeOrder.pickup_location?.coordinates) {
                            dest_lon = activeOrder.pickup_location.coordinates[0];
                            dest_lat = activeOrder.pickup_location.coordinates[1];
                        } else if (activeOrder.status === 'in_transit' && activeOrder.dropoff_location?.coordinates) {
                            dest_lon = activeOrder.dropoff_location.coordinates[0];
                            dest_lat = activeOrder.dropoff_location.coordinates[1];
                        }
                    }

                    const hasDriver = activeOrder.driver_first_name || activeOrder.driver_last_name;

                    summaryBox.innerHTML = `
						<div class="d-flex justify-content-between align-items-center mb-2">
							<span class="fw-bold text-dark">Active Order ID: #${activeOrder.id}</span>
							<span class="badge bg-info text-uppercase" style="font-size: 0.65rem;">${activeOrder.status}</span>
						</div>
						
						<div class="row g-2 small text-secondary mb-2">
							<div class="col-12 col-md-6"><strong>Material:</strong> ${activeOrder.material_description}</div>
							<div class="col-12 col-md-6"><strong>Customer:</strong> ${activeOrder.customer_first_name || ''} ${activeOrder.customer_last_name || ''}</div>
						</div>
						
						<div class="row g-2 small text-secondary mb-3">
							<div class="col-12 col-md-6"><strong>Pickup:</strong> ${activeOrder.pickup_address}</div>
							<div class="col-12 col-md-6"><strong>Delivery:</strong> ${activeOrder.delivery_address}</div>
						</div>

						${hasDriver ? `
							<div class="bg-white p-3 rounded-3 border small text-secondary mt-2">
								<div class="fw-semibold text-dark mb-1"><i class="fa-solid fa-id-badge me-1 text-primary"></i> Assigned Driver Information</div>
								<div class="row g-2">
									<div class="col-12 col-sm-6">👤 <strong>Driver Name:</strong> ${activeOrder.driver_first_name || ''} ${activeOrder.driver_last_name || ''}</div>
									<div class="col-12 col-sm-6">🚚 <strong>Vehicle No:</strong> ${activeOrder.vehicle_no || 'N/A'}</div>
									<div class="col-12 col-sm-6">📞 <strong>Phone:</strong> ${activeOrder.driver_phone_number ? `<a href="tel:${activeOrder.driver_phone_number}" class="text-primary fw-semibold text-decoration-none">${activeOrder.driver_phone_number}</a>` : 'Not provided'}</div>
									<div class="col-12 col-sm-6">📧 <strong>Email:</strong> ${activeOrder.driver_email ? `<a href="mailto:${activeOrder.driver_email}" class="text-primary fw-semibold text-decoration-none">${activeOrder.driver_email}</a>` : 'Not provided'}</div>
								</div>
							</div>
						` : `
							<div class="alert alert-warning py-1 px-2 small mb-0 mt-2">
								<i class="fa-solid fa-triangle-exclamation me-1"></i> No driver assigned to this order yet.
							</div>
						`}
					`;
                } else {
                    summaryBox.innerHTML = `
                        <div class="text-center text-muted py-1 small">
                            <i class="fa-solid fa-circle-info me-1"></i> No active order context found. Tracking vehicle GPS telemetry only.
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Failed to load order context:", err);
            }
        }

        async function fetchVehicleLiveLocation() {
            const token = getAccessToken();
            if (!token || !vehicleId) return;
            
            try {
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/location/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch location");

                const data = await response.json();
                
                if (data.lat && data.lon) {
                    const latLng = [data.lat, data.lon];

                    if (vehicleMarker) {
                        vehicleMarker.setLatLng(latLng);
                    } else {
                        vehicleMarker = L.marker(latLng).addTo(map)
                            .bindPopup("<b>Live Driver Location</b>").openPopup();
                        map.setView(latLng, 15);
                    }
                    
                    if (!isNaN(dest_lat) && !isNaN(dest_lon)) {
                        displayRouteOnMap(data.lat, data.lon, dest_lat, dest_lon);
                    }
                }
                
            } catch (err) {
                console.error("Unable to fetch location:", err);
            }
        }
        
        function displayRouteOnMap(startLat, startLon, endLat, endLon) {
            if (routeControl) {
                map.removeControl(routeControl);
            }

            routeControl = L.Routing.control({
                waypoints: [
                    L.latLng(startLat, startLon),
                    L.latLng(endLat, endLon)
                ],
                routeWhileDragging: false,
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                show: false 
            }).addTo(map);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchActiveOrderContext();
            fetchVehicleLiveLocation();
        });
        setInterval(fetchVehicleLiveLocation, 5000);
    </script>
</body>
</html>
