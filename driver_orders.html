<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver - Available Orders</title>

	<!-- Local Bootstrap Compiled CSS -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
	<!-- Local FontAwesome Icons -->
	<link href="static/css/all.min.css" rel="stylesheet">
	
	
	<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .toast-container {
            z-index: 1080;
        }
		.hidden { display: none !important; }
		.card { 
			background: white; 
			padding: 20px; 
			border-radius: 8px; 
			box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
			margin-bottom: 15px auto; 
			box-sizing: border-box;
			width: 100%;
			max-width: 550px;
		}
		.order-item { border-left: 4px solid #ffc107; padding: 15px; margin-bottom: 15px; background: #fafafa; border-radius: 4px; }
		.assigned {
			border-left-color: #28a745;
		}
    </style>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">
	<div class="container max-w-3xl my-4" style="max-width: 100%;">
    
		<!-- Back Button -->
		<a href="index.html" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
			<i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
		</a>
		
		<!-- Main Card Container -->
		<div class="card shadow-sm border-0 rounded-4" style="max-width: 100%;">
			<div class="card-body p-4 p-sm-5">
				
				<!-- Header Section -->
				<h3 class="fw-bold text-dark mb-1">🚚 Driver Portal - Delivery Queue</h3>
				<p class="text-muted small mb-4">Accept pending supply orders and start your deliveries.</p>
				
				<!-- Message Alert Container -->
				<div id="msg"></div>
				
				<!-- Tab Navigation using Bootstrap Nav Pills -->
				<ul class="nav nav-pills gap-2 mb-4" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active fw-semibold px-3 py-2 rounded-3" id="btn-active" onclick="switchTab('active')" type="button">
							Active Queue
						</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link fw-semibold px-3 py-2 rounded-3 text-secondary bg-light" id="btn-history" onclick="switchTab('history')" type="button">
							Delivery History
						</button>
					</li>
				</ul>
				
				<!-- Orders Dynamic Content Container -->
				<div id="orders-container">
					<!-- Orders will dynamically render here -->
				</div>
				
			</div>
		</div>
	</div>
	
	<!-- <script src="/static/js/global-tracker.js"></script> -->
	<script src="/static/js/tracker.js"></script>
	
    <script>
        const API_BASE = 'https://upheaval-revise-fit.ngrok-free.dev/etransport/api';
        const token = localStorage.getItem('accessToken');

        async function fetchOrders() {
            const container = document.getElementById('orders-container');
            const msg = document.getElementById('msg');
			
            if (!token) {
                container.innerHTML = '<p style="color: red;">Authentication token missing. Please log in as a driver.</p>';
                return;
            }

			let url = `${API_BASE}/orders/`;
			let radius = 25;			// fetch order within 10km radius
			try {
				const position = await new Promise((resolve, reject) => {
					if (!navigator.geolocation) {
						reject(new Error("Geolocation is not supported by your browser"));
					} else {
						navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
					}
				});

				const lat = position.coords.latitude;
				const lon = position.coords.longitude;

				if (lat && lon) {
					url += `?lat=${lat}&lon=${lon}&radius=${radius}`;
				}
			} catch (error) {
				console.warn("Geolocation denied or unavailable. Fetching all orders without distance filter.", error.message);
			}

            try {
                const response = await fetch(url, {
                    headers: { 
						'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true' // <-- Add this exact line! 					
					}
                });
				// Check for specific status codes first
				if (response.status === 403) {
					throw new Error("Access denied. You do not have active subscription to view these orders.");
				}
                if (!response.ok) throw new Error(`Failed to fetch orders. Status: ${response.status}`);

                const orders = await response.json();
				console.log(orders);
				
                if (orders.length === 0) {
                    container.innerHTML = `
						<div class="text-center py-4 text-muted border border-dashed rounded-3 bg-light">
							<i class="fa-solid fa-box-open fs-3 mb-2"></i>
							<p class="mb-0 small">No orders available at the moment.</p>
						</div>`;
                    return;
                }

                orders.sort((a, b) => {
                    const activeStatuses = ['assigned', 'in_transit'];
                    const aIsActive = activeStatuses.includes(a.status);
                    const bIsActive = activeStatuses.includes(b.status);

                    if (aIsActive && !bIsActive) return -1;
                    if (!aIsActive && bIsActive) return 1;
                    return 0;
                });
				
                const hasActiveOrder = orders.some(o => o.status === 'assigned' || o.status === 'in_transit');
				if (hasActiveOrder) {
                    msg.innerHTML = `
						<div class="alert alert-warning d-flex align-items-center small py-2 mb-3" role="alert">
						<i class="fa-solid fa-triangle-exclamation me-2"></i>
						<div>You have an active ongoing delivery. Complete or reject it before accepting new orders.</div>
					</div>`;
                } else {
                    msg.innerHTML = '';
                }
				
				container.innerHTML = orders.map(o => {
                    const isAcceptedByMe = o.status === 'assigned' || o.status === 'in_transit';
                    
                    let actionHtml = '';
                    if (o.status === 'pending') {
                        if (hasActiveOrder) {
							actionHtml = `<button class="btn btn-secondary btn-sm w-100 disabled" style="cursor: not-allowed;">Accept Order (Complete current first)</button>`;
                        } else {
							actionHtml = `<button onclick="acceptOrder(${o.id})" class="btn btn-primary btn-sm w-100 fw-semibold">Accept Order</button>`;
                        }
                    } else if (isAcceptedByMe) {
						actionHtml = `
							<div class="mb-2 text-muted small">Current Status: <strong class="text-uppercase">${o.status}</strong></div>
							
							<button onclick="startNavigation('${o.status}', '${o.pickup_address}', '${o.delivery_address}')" class="btn btn-sm text-white w-100 mb-2 fw-semibold" style="background-color: #8b5cf6;">
								<i class="fa-solid fa-compass me-1"></i> ${o.status === 'assigned' ? 'Navigate to Pickup' : 'Navigate to Delivery'}
							</button>

							${o.status === 'assigned' ? `
								<button onclick="updateOrderStatus(${o.id}, 'in_transit')" class="btn btn-warning btn-sm text-dark w-100 mb-2 fw-semibold">Start In Transit</button>
								<button onclick="rejectOrder(${o.id})" class="btn btn-danger btn-sm text-white w-100 fw-semibold">❌ Reject Order</button>
							` : ''}

							${o.status === 'in_transit' ? `<button onclick="updateOrderStatus(${o.id}, 'delivered')" class="btn btn-success btn-sm text-white w-100 fw-semibold">Mark as Delivered</button>` : ''}
						`;
					} else if (o.status === 'delivered') {
						actionHtml = `
							<div class="mb-2 text-muted small">Current Status: <strong class="text-success text-uppercase">Delivered</strong></div>
							<a href="order_history.html?id=${o.id}" target="_blank" class="btn btn-info btn-sm text-white w-100 fw-semibold text-decoration-none mt-1">
								<i class="fa-solid fa-map-location-dot me-1"></i> See Route Trail
							</a>
						`;
					}

					return `
						<div class="card mb-3 border ${isAcceptedByMe ? 'border-primary bg-primary bg-opacity-10' : 'border-light'} w-100 shadow-sm rounded-3" style="max-width: 100%;">
							<div class="card-body p-3">
								<div class="d-flex justify-content-between align-items-center mb-2">
									<span class="fw-bold text-dark">Order ID: #${o.id}</span>
									<span class="badge bg-secondary text-uppercase">${o.status}</span>
								</div>
								<p class="mb-1 small"><strong>Material:</strong> ${o.material_description}</p>
								<p class="mb-1 small"><strong>Ordered By:</strong> ${o.customer_first_name} ${o.customer_last_name}</p>
								<p class="mb-1 small"><strong>Pickup:</strong> ${o.pickup_address}</p>
								<p class="mb-3 small"><strong>Delivery:</strong> ${o.delivery_address}</p>
								<div class="border-top pt-2 mt-2">${actionHtml}</div>
							</div>
						</div>
					`;
				}).join('');

			} catch (err) {
				console.error(err);
				container.innerHTML = `
					<div class="alert alert-danger small" role="alert">
						<i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${err.message}
					</div>`;
			}
        }

        async function acceptOrder(orderId) {
            const msg = document.getElementById('msg');
            msg.innerText = `Accepting Order #${orderId}...`;
            msg.style.color = "#007BFF";

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/accept-order/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
					body: JSON.stringify({ vehicle_id: 1 }) 
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to accept order.");

                msg.innerText = `Success! Order #${orderId} accepted.`;
                msg.style.color = "green";
                fetchOrders();
            } catch (err) {
                console.error(err);
                msg.innerText = `Error: ${err.message}`;
                msg.style.color = "red";
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm(`Are you sure you want to reject Order #${orderId}? It will be returned to the general queue.`)) return;

            const msg = document.getElementById('msg');
            msg.innerText = `Rejecting Order #${orderId}...`;
            msg.style.color = "#ef4444";

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/reject_order/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true' // <-- Add this exact line! 
                    }
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to reject order.");

                msg.innerText = `Order #${orderId} successfully rejected.`;
                msg.style.color = "green";
                fetchOrders();
            } catch (err) {
                console.error(err);
                msg.innerText = `Error: ${err.message}`;
                msg.style.color = "red";
            }
        }
		
		async function updateOrderStatus(orderId, newStatus) {
			const msg = document.getElementById('msg');
			msg.innerText = `Getting your GPS location...`;
			msg.style.color = "#007BFF";

			try {
				const position = await new Promise((resolve, reject) => {
					if (!navigator.geolocation) {
						reject(new Error("Geolocation is not supported by your browser"));
					} else {
						navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 20000 });
					}
				});

				const lat = position.coords.latitude;
				const lon = position.coords.longitude;

				msg.innerText = `Validating location buffer and updating Order #${orderId}...`;
				let payload = { 
						'status': newStatus,
						'lat': lat,
						'lon': lon,
					}
					 
				<!-- console.log(payload); -->
				const response = await fetch(`${API_BASE}/orders/${orderId}/update-status/`, {
					method: 'PATCH',
					headers: {
						'Content-Type': 'application/json',
						'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true'
					},
					body: JSON.stringify(payload)
				});

				const data = await response.json();
				if (!response.ok) throw new Error(data.error || "Failed to update status.");

				msg.innerText = `Success! ${data.message}`;
				msg.style.color = "green";
				fetchOrders();

			} catch (err) {
				console.error(err);
				msg.innerText = `Error: ${err.message}`;
				msg.style.color = "red";
			}
		}
		
		function startNavigation(status, pickupAddress, deliveryAddress) {
			let targetAddress = status === 'assigned' ? pickupAddress : deliveryAddress;
			if (!targetAddress) {
				alert("Address not available for navigation.");
				return;
			}
			<!-- console.log("Tracker Started"); -->
			initSilentTracker()
			const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(targetAddress)}&travelmode=driving`;
			window.open(mapUrl, '_blank');
		}
		
		
		
		
		
		
		let currentTab = 'active';
		function switchTab(tab) {
			currentTab = tab;
			
			const activeBtn = document.getElementById('btn-active');
			const historyBtn = document.getElementById('btn-history');

			// Toggle Bootstrap classes based on selected tab
			if (tab === 'active') {
				activeBtn.className = 'nav-link active fw-semibold px-3 py-2 rounded-3';
				historyBtn.className = 'nav-link fw-semibold px-3 py-2 rounded-3 text-secondary bg-light';
				fetchOrders();
			} else {
				historyBtn.className = 'nav-link active fw-semibold px-3 py-2 rounded-3';
				activeBtn.className = 'nav-link fw-semibold px-3 py-2 rounded-3 text-secondary bg-light';
				fetchHistory();
			}
		}
		
		
		async function fetchHistory() {
			const container = document.getElementById('orders-container');
			container.innerHTML = '<p>Loading delivery history...</p>';

			try {
				const response = await fetch(`${API_BASE}/orders/history/`, {
					headers: { 
						'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true' // <-- Add this exact line! 
					}
				});

				if (response.status === 403) {
					throw new Error("Access denied. You do not have active subscription to view these orders.");
				}
                if (!response.ok) throw new Error(`Failed to fetch order history. Status: ${response.status}`);
				
		
				const orders = await response.json();
				console.log('orders_history', orders);
				if (orders.length === 0) {
					container.innerHTML = `
						<div class="text-center py-4 text-muted border border-dashed rounded-3 bg-light w-100">
							<i class="fa-solid fa-clock-rotate-left fs-3 mb-2"></i>
							<p class="mb-0 small">No completed delivery history found.</p>
						</div>
					`;
					return;
				}

				container.innerHTML = orders.map(o => `
						<div class="card mb-3 border border-primary bg-primary bg-opacity-10 w-100 shadow-sm rounded-3" style="max-width: 100%;">
							<div class="card-body p-3">
								<div class="d-flex justify-content-between align-items-center mb-2">
									<span class="fw-bold text-dark">Order ID: #${o.id}</span>
									<span class="badge bg-secondary text-uppercase">${o.status}</span>
								</div>
								<p class="mb-1 small"><strong>Material:</strong> ${o.material_description}</p>
								<p class="mb-1 small"><strong>Ordered By:</strong> ${o.customer_first_name} ${o.customer_last_name}</p>
								<p class="mb-1 small"><strong>Pickup:</strong> ${o.pickup_address}</p>
								<p class="mb-3 small"><strong>Delivery:</strong> ${o.delivery_address}</p>
								<p class="mb-1 small"><em>Status: <strong style="color: #10b981;">DELIVERED</strong></em></p>
								<a href="order_history.html?id=${o.id}" target="_blank" class="btn btn-info btn-sm text-white fw-semibold text-decoration-none mt-1">
									<i class="fa-solid fa-map-location-dot me-1"></i> See Route Trail
								</a>
							</div>
						</div>
				`).join('');
				
			} catch (err) {
				console.error(err);
				container.innerHTML = `
					<div class="alert alert-danger small" role="alert">
							<i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${err.message}
					</div>`;
			}
		}
		
		// Silently fetch the driver's assigned vehicle ID on load
		let apiUrl = "";
        async function initSilentTracker() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                console.warn("Authentication token not found. Background tracking paused.");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/users/me/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch driver profile.");

                const userData = await response.json();
                
                // Check if vehicle is assigned
                if (userData.assigned_vehicle && userData.assigned_vehicle.id) {
                    const vehicleId = userData.assigned_vehicle.id;
                    
                    // Build dynamic update endpoint URL silently
                    apiUrl = `${API_BASE}/vehicles/${vehicleId}/update-location/`;
                    
                    // Start background GPS watch loop automatically
                    startSilentWatch();
                } else {
                    console.warn("No vehicle currently assigned to this driver account.");
                }

            } catch (err) {
                console.error("Silent tracker initialization error:", err);
            }
        }

        // 2. Start continuous silent GPS watching
        function startSilentWatch() {
            if (!navigator.geolocation) {
                console.error("Geolocation is not supported by this browser.");
                return;
            }

            navigator.geolocation.watchPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Send update to backend without alerting UI
                    sendLocationSilently(lat, lon);
                },
                error => {
                    console.warn(`GPS Watch Warning: ${error.message}`);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 10000,
                    timeout: 5000
                }
            );
        }

        // 3. Send location payload via PATCH in the background
        async function sendLocationSilently(lat, lon) {
            const token = localStorage.getItem('accessToken');
            if (!apiUrl || !token) return;

            try {
                await fetch(apiUrl, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ lat: lat, lon: lon })
                });
				<!-- console.log("send location", { lat: lat, lon: lon }); -->
            } catch (err) {
                console.error("Silent location sync network error:", err);
            }
        }
		

        document.addEventListener('DOMContentLoaded', fetchOrders);
		document.addEventListener('DOMContentLoaded', () => {
			const token = localStorage.getItem('accessToken');
			const userRole = localStorage.getItem('userRole');
			const vehicleId = localStorage.getItem('driver_vehicle_id');

			if (token && vehicleId && userRole === 'driver') {
				startBackgroundDriverTracker();
			}
		});
    </script>
</body>
</html>
