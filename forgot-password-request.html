<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Password Reset - Fleet Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container" style="max-width: 420px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-sm-5">
            
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h3 class="fw-bold text-dark">Forgot Password</h3>
                <p class="text-muted small mb-0">Enter your registered email or mobile number to receive a secure reset link.</p>
            </div>

            <!-- Feedback Message Box -->
            <div id="requestMsg"></div>

            <!-- Reset Request Form -->
            <form id="resetRequestForm" onsubmit="requestResetLink(event)">
                
                <!-- Input Option: Email or Phone -->
                <div class="mb-3">
                    <label for="credential" class="form-label text-muted small fw-semibold">Email Address Or Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user-shield"></i></span>
                        <input type="text" id="credential" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Enter email or phone" required>
                    </div>
                    <div class="form-text text-muted" style="font-size: 0.75rem;">We will send a reset link to your registered contact.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Send Reset Link</button>
            </form>

            <!-- Back To Login Link -->
            <div class="text-center mt-4 pt-3 border-top">
                <a href="index.html" class="text-decoration-none small fw-semibold text-muted">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back To Login
                </a>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";

        async function requestResetLink(event) {
            event.preventDefault();
            const credential = document.getElementById('credential').value.trim();
            const msg = document.getElementById('requestMsg');

            if (!credential) {
                msg.innerHTML = '<div class="alert alert-danger py-2 small" role="alert">Please enter your email or phone number.</div>';
                return;
            }

            // Simple check to determine if input is email or phone number
            const isEmail = credential.includes('@');
            const payload = isEmail ? { email: credential } : { phone_number: credential };

            try {
                msg.innerHTML = '<div class="alert alert-info py-2 small" role="alert"><span class="spinner-border spinner-border-sm me-1"></span> Generating reset link...</div>';

                const response = await fetch(`${API_BASE}/user_profiles/password-reset-link-request/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to request password reset.");

                msg.innerHTML = `<div class="alert alert-success py-2 small" role="alert">${data.message}</div>`;
                document.getElementById('resetRequestForm').reset();

            } catch (err) {
                msg.innerHTML = `<div class="alert alert-danger py-2 small" role="alert">${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
