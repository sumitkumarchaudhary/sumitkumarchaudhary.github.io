		async function fetchVehicleHistory() {
            const ordersContainer = document.getElementById('orders-area');
            const titleElement = document.getElementById('vehicle-title');
            const token = getAccessToken();

            if (!vehicleId) {
                ordersContainer.innerHTML = '<div class="alert alert-danger small">No vehicle ID provided in the URL.</div>';
                return;
            }

            if (!token) {
                ordersContainer.innerHTML = '<div class="alert alert-danger small">Authentication token not found. Please log in.</div>';
                return;
            }

            try {
                // Fetch from your backend vehicle history endpoint
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/history/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to fetch history (Status: ${response.status})`);
                }

                const data = await response.json();
                console.log(data);
                titleElement.textContent = `History Trail: ${data.vehicle_no} (${data.vehicle_type_description})`;
                
                // 1. Render Coordinate History Trail
                if (data.coordinate_history && data.coordinate_history.length > 0) {
                    const coordinates = data.coordinate_history; 
                    if (!coordinates || coordinates.length === 0) {
                        console.warn("No route coordinates found for this order.");
                        return;
                    }
                    
                    const latLngs = coordinates.map(coord => [coord['lat'], coord['lon']]);
                    
                    // Draw the Polyline on the map
                    const polyline = L.polyline(latLngs, { color: '#0d6efd', weight: 4 }).addTo(map);
                    
                    // Add circle markers at vertices with tooltips
                    const gpsTrack = coordinates.map(coord => [coord['lat'], coord['lon'], coord['timestamp']]);
                    gpsTrack.forEach(coord => {
                        const [lat, lng, timestamp] = coord;
                        
                        L.circleMarker([lat, lng], {
                            radius: 6,
                            fillColor: "#ff7800",
                            color: "#fff",
                            weight: 1,
                            opacity: 0.1,
                            fillOpacity: 0.1
                        })
                        .bindTooltip(`<b>Date:</b> ${new Date(timestamp).toLocaleDateString()}<br><b>Time:</b> ${new Date(timestamp).toLocaleTimeString()}`)
                        .addTo(map);
                    });                    
                    
                    // Zoom map to fit the path perfectly
                    map.fitBounds(polyline.getBounds());
                }

                // 2. Render Orders History
                if (data.orders_history && data.orders_history.length > 0) {
                    ordersContainer.innerHTML = data.orders_history.map(o => `
                        <div class="card mb-3 border border-light shadow-sm rounded-3">
                            <div class="card-body p-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-bold text-dark">Order ID: #${o.order_id}</span>
                                    <span class="badge bg-success text-uppercase">${o.status}</span>
                                </div>
                                <p class="mb-1 small"><strong>Material:</strong> ${o.material}</p>
                                <p class="mb-1 small"><strong>Customer:</strong> ${o.customer}</p>
								<p class="mb-1 small"><strong>Pickup:</strong> ${o.pickup_address}</p>
								<p class="mb-1 small"><strong>Dropoff:</strong> ${o.delivery_address}</p>
                                <p class="mb-0 text-muted" style="font-size: 0.75rem;"><i class="fa-regular fa-clock me-1"></i> Created at: ${new Date(o.created_at).toLocaleString('en-IN')}</p>
                                <p class="mb-0 text-muted" style="font-size: 0.75rem;"><i class="fa-solid fa-square-check me-1"></i> Delivered at: ${o.completed_at ? new Date(o.completed_at).toLocaleString() : "Not Available"}</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    ordersContainer.innerHTML = `
                        <div class="text-center py-4 text-muted border border-dashed rounded-3 bg-light">
                            <i class="fa-solid fa-box-open fs-3 mb-2"></i>
                            <p class="mb-0 small">No past orders associated with this vehicle.</p>
                        </div>`;
                }

            } catch (error) {
                console.error('Error fetching history:', error);
                ordersContainer.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${error.message}
                    </div>`;
            }
        }

		let driverMarker = null;
		// Function to fetch latest coordinates and update the map marker
        async function fetchAndUpdateLiveLocation() {
            const token = localStorage.getItem('accessToken');
            
            try {
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/history/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch location");

                const data = await response.json();
				// 1. Render Coordinate History Trail
                if (data.coordinate_history && data.coordinate_history.length > 0) {
					const coordinates = data.coordinate_history; 
					if (!coordinates || coordinates.length === 0) {
						console.warn("No route coordinates found for this order.");
						return;
					}
					
					// 3. Leaflet expects coordinates as [latitude, longitude], 
					// but GeoJSON/Backend typically outputs [longitude, latitude]. Map them:
					const latLngs = coordinates.map(coord => [coord['lat'], coord['lon']]);
					
					<!-- console.log(latLngs); -->
					
					// 4. Draw the Polyline on the map
					const polyline = L.polyline(latLngs, { color: 'blue', weight: 4 }).addTo(map);
					
					// 2. Add invisible or small circle markers at each vertex to hold the timestamps
					gpsTrack = coordinates.map(coord => [coord['lat'], coord['lon'], coord['timestamp']])
					gpsTrack.forEach(coord => {
						const [lat, lng, timestamp] = coord;
						
						L.circleMarker([lat, lng], {
							radius: 8,
							fillColor: "#ff7800",
							color: "#000",
							weight: 1,
							opacity: 0,
							fillOpacity: 0
						})
						.bindTooltip(`<b>Date:</b> ${new Date(timestamp).toLocaleDateString()} <b>Time:</b> ${new Date(timestamp).toLocaleTimeString()}`)
						.addTo(map);
					});					
					<!-- // Zoom map to fit the path perfectly -->
					<!-- map.fitBounds(polyline.getBounds()); -->
					
					
					<!-- container.innerHTML = data.coordinate_history.map((pt, index) => ` -->
                        <!-- <div class="history-item"> -->
                            <!-- <strong>Point #${index + 1}:</strong>  -->
                            <!-- Latitude: <code>${pt.lat.toFixed(5)}</code>,  -->
                            <!-- Longitude: <code>${pt.lon.toFixed(5)}</code> -->
                            <!-- <a href="https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lon}" target="_blank" style="float: right; color: #4f46e5; text-decoration: none;">Map ↗</a> -->
                        <!-- </div> -->
                    <!-- `).join(''); -->
                }
				
                const lat = data.currlat;
                const lon = data.currlon;

                if (lat && lon) {
                    const latLng = [lat, lon];

                    if (driverMarker) {
                        // 🚀 Smoothly update existing marker position without re-centering map forcibly
                        driverMarker.setLatLng(latLng);
                    } else {
                        // Create marker on first load and center map on it
                        driverMarker = L.marker(latLng).addTo(map)
                            .bindPopup("<b>Live Driver Location</b>").openPopup();
                        <!-- map.setView(latLng, 15); -->
                    }
                }
            } catch (err) {
                console.error("Tracking fetch error:", err);
            }
        }

        // Run immediately on load, then poll every 5 seconds

		document.addEventListener('DOMContentLoaded', () => {
			const token = localStorage.getItem('accessToken');
			const userRole = localStorage.getItem('userRole');
			const vehicleId = localStorage.getItem('driver_vehicle_id');

			if (token && vehicleId && userRole === 'driver') {
				startBackgroundDriverTracker();
				fetchVehicleHistory();
				fetchAndUpdateLiveLocation();
				setInterval(fetchAndUpdateLiveLocation, 5000);
			}
			if (token && userRole === 'owner'){
				fetchVehicleHistory();
				fetchAndUpdateLiveLocation();
				setInterval(fetchAndUpdateLiveLocation, 5000);
			} else {
				fetchVehicleHistory();
			}
		});
