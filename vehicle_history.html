<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Vehicle History Trail</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        h2 { color: #4f46e5; margin-bottom: 1rem; }
        .back-btn { display: inline-block; margin-bottom: 1.5rem; color: #4f46e5; text-decoration: none; font-weight: 600; }
        .back-btn:hover { text-decoration: underline; }
        .history-item, .order-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        .loading { font-style: italic; color: #64748b; }
        .error { color: #ef4444; font-weight: bold; }
		
    </style>
	<style>
        #map { height: 300px; width: 100%; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Dashboard</a>
	
    <div class="card">
        <h2 id="vehicle-title">Vehicle History Timeline</h2>
		<div id="map"></div>
        <!-- <div id="content-area" class="loading">Loading vehicle history data...</div> -->
    </div>
    <div class="card">
        <h2>📦 Associated Delivery Orders</h2>
        <div id="orders-area" class="loading">Loading order history...</div>
    </div>
	
	<!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="/static/js/tracker.js"></script>
    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        
        // Extract vehicle ID from URL query parameters (e.g., vehicle_history.html?id=3)
        const urlParams = new URLSearchParams(window.location.search);
        const vehicleId = urlParams.get('id');

        function getAccessToken() {
            return localStorage.getItem('accessToken');
        }
		
		// 1. Initialize the map
        const map = L.map('map').setView([28.5355, 77.3910], 13); // Default center (e.g., Noida)

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        async function fetchVehicleHistory() {
            const container = document.getElementById('content-area');
            const ordersContainer = document.getElementById('orders-area');
            const titleElement = document.getElementById('vehicle-title');
            const token = getAccessToken();

            if (!vehicleId) {
                container.innerHTML = '<p class="error">No vehicle ID provided in the URL.</p>';
                ordersContainer.innerHTML = '';
                return;
            }

            if (!token) {
                container.innerHTML = '<p class="error">Authentication token not found. Please log in.</p>';
                return;
            }

            try {
                // Fetch from your backend vehicle history endpoint
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/history/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true' // <-- Add this exact line!
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to fetch history (Status: ${response.status})`);
                }

                const data = await response.json();
                console.log(data);
                titleElement.textContent = `History Trail: ${data.vehicle_no} (${data.vehicle_type})`;
				
				
				
				
                // 1. Render Coordinate History Trail
                if (data.coordinate_history && data.coordinate_history.length > 0) {
					const coordinates = data.coordinate_history; 
					if (!coordinates || coordinates.length === 0) {
						console.warn("No route coordinates found for this order.");
						return;
					}
					
					// 3. Leaflet expects coordinates as [latitude, longitude], 
					// but GeoJSON/Backend typically outputs [longitude, latitude]. Map them:
					const latLngs = coordinates.map(coord => [coord['lat'], coord['lon']]);
					
					<!-- console.log(latLngs); -->
					
					// 4. Draw the Polyline on the map
					const polyline = L.polyline(latLngs, { color: 'blue', weight: 4 }).addTo(map);
					
					// 2. Add invisible or small circle markers at each vertex to hold the timestamps
					gpsTrack = coordinates.map(coord => [coord['lat'], coord['lon'], coord['timestamp']])
					gpsTrack.forEach(coord => {
						const [lat, lng, timestamp] = coord;
						
						L.circleMarker([lat, lng], {
							radius: 8,
							fillColor: "#ff7800",
							color: "#000",
							weight: 1,
							opacity: 0,
							fillOpacity: 0
						})
						.bindTooltip(`<b>Time:</b> ${new Date(timestamp).toLocaleTimeString()}`)
						.addTo(map);
					});					
					// Zoom map to fit the path perfectly
					map.fitBounds(polyline.getBounds());

                    <!-- container.innerHTML = data.coordinate_history.map((pt, index) => ` -->
                        <!-- <div class="history-item"> -->
                            <!-- <strong>Point #${index + 1}:</strong>  -->
                            <!-- Latitude: <code>${pt.lat.toFixed(5)}</code>,  -->
                            <!-- Longitude: <code>${pt.lon.toFixed(5)}</code> -->
                            <!-- <a href="https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lon}" target="_blank" style="float: right; color: #4f46e5; text-decoration: none;">Map ↗</a> -->
                        <!-- </div> -->
                    <!-- `).join(''); -->
                } else {
                    container.innerHTML = '<p>No location coordinate trail recorded yet for this vehicle.</p>';
                }

                // 2. Render Orders History
                if (data.orders_history && data.orders_history.length > 0) {
                    ordersContainer.innerHTML = data.orders_history.map(o => `
                        <div class="order-item">
                            <p><strong>Order ID:</strong> #${o.order_id}</p>
                            <p><strong>Material:</strong> ${o.material}</p>
                            <p><strong>Customer:</strong> ${o.customer}</p>
                            <p><strong>Status:</strong> <span style="text-transform: uppercase; font-weight: bold; color: #10b981;">${o.status}</span></p>
                            <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Created: ${new Date(o.created_at).toLocaleString()}</p>
                        </div>
                    `).join('');
                } else {
                    ordersContainer.innerHTML = '<p>No past orders associated with this vehicle.</p>';
                }

            } catch (error) {
                console.error('Error fetching history:', error);
                container.innerHTML = `<p class="error">Error: ${error.message}</p>`;
                ordersContainer.innerHTML = `<p class="error">Could not load orders.</p>`;
            }
        }
		
		let driverMarker = null;
		// Function to fetch latest coordinates and update the map marker
        async function fetchAndUpdateLiveLocation() {
            const token = localStorage.getItem('accessToken');
            
            try {
                const response = await fetch(`${API_BASE}/vehicles/${vehicleId}/history/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch location");

                const data = await response.json();
				// 1. Render Coordinate History Trail
                if (data.coordinate_history && data.coordinate_history.length > 0) {
					const coordinates = data.coordinate_history; 
					if (!coordinates || coordinates.length === 0) {
						console.warn("No route coordinates found for this order.");
						return;
					}
					
					// 3. Leaflet expects coordinates as [latitude, longitude], 
					// but GeoJSON/Backend typically outputs [longitude, latitude]. Map them:
					const latLngs = coordinates.map(coord => [coord['lat'], coord['lon']]);
					
					<!-- console.log(latLngs); -->
					
					// 4. Draw the Polyline on the map
					const polyline = L.polyline(latLngs, { color: 'blue', weight: 4 }).addTo(map);
					
					// 2. Add invisible or small circle markers at each vertex to hold the timestamps
					gpsTrack = coordinates.map(coord => [coord['lat'], coord['lon'], coord['timestamp']])
					gpsTrack.forEach(coord => {
						const [lat, lng, timestamp] = coord;
						
						L.circleMarker([lat, lng], {
							radius: 8,
							fillColor: "#ff7800",
							color: "#000",
							weight: 1,
							opacity: 0,
							fillOpacity: 0
						})
						.bindTooltip(`<b>Date:</b> ${new Date(timestamp).toLocaleDateString()} <b>Time:</b> ${new Date(timestamp).toLocaleTimeString()}`)
						.addTo(map);
					});					
					<!-- // Zoom map to fit the path perfectly -->
					<!-- map.fitBounds(polyline.getBounds()); -->
					
					
					<!-- container.innerHTML = data.coordinate_history.map((pt, index) => ` -->
                        <!-- <div class="history-item"> -->
                            <!-- <strong>Point #${index + 1}:</strong>  -->
                            <!-- Latitude: <code>${pt.lat.toFixed(5)}</code>,  -->
                            <!-- Longitude: <code>${pt.lon.toFixed(5)}</code> -->
                            <!-- <a href="https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lon}" target="_blank" style="float: right; color: #4f46e5; text-decoration: none;">Map ↗</a> -->
                        <!-- </div> -->
                    <!-- `).join(''); -->
                }
				
                const lat = data.currlat;
                const lon = data.currlon;

                if (lat && lon) {
                    const latLng = [lat, lon];

                    if (driverMarker) {
                        // 🚀 Smoothly update existing marker position without re-centering map forcibly
                        driverMarker.setLatLng(latLng);
                    } else {
                        // Create marker on first load and center map on it
                        driverMarker = L.marker(latLng).addTo(map)
                            .bindPopup("<b>Live Driver Location</b>").openPopup();
                        map.setView(latLng, 15);
                    }
                }
            } catch (err) {
                console.error("Tracking fetch error:", err);
            }
        }

        // Run immediately on load, then poll every 5 seconds       
		<!-- document.addEventListener('DOMContentLoaded', () => { -->
			<!-- fetchAndUpdateLiveLocation(); -->
		<!-- }); -->
		<!-- setInterval(fetchAndUpdateLiveLocation, 5000); -->
		
		
		
        <!-- document.addEventListener('DOMContentLoaded', fetchVehicleHistory); -->
		document.addEventListener('DOMContentLoaded', () => {
			const token = localStorage.getItem('accessToken');
			const userRole = localStorage.getItem('userRole');
			const vehicleId = localStorage.getItem('driver_vehicle_id');

			if (token && vehicleId && userRole === 'driver') {
				startBackgroundDriverTracker();
			}
			if (token && userRole === 'owner'){
				fetchAndUpdateLiveLocation();
				setInterval(fetchAndUpdateLiveLocation, 5000);
			} else {
				fetchVehicleHistory();
			}
		});
    </script>
</body>
</html>
