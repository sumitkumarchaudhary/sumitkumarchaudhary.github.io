<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Route & Telemetry Trail</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b;
        }
        #map { 
            height: 450px; 
            width: 100%; 
            border-radius: 0.5rem;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4" style="max-width: 950px;">
        
        <!-- Back Button -->
        <a onclick="history.back()" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
        </a>

        <!-- Map & Route Timeline Card -->
        <div class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-body p-4 p-sm-5">
                <div class="d-flex align-items-center mb-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px; min-width: 45px;">
                        <i class="fa-solid fa-map-location-dot fs-5"></i>
                    </div>
                    <div>
                        <h3 id="order-title" class="fw-bold text-dark mb-0">Order Route Playback</h3>
                        <p class="text-muted small mb-0">Interactive telemetry coordinate mapping and completed shipment path.</p>
                    </div>
                </div>

                <!-- Leaflet Map Container -->
                <div id="map" class="border shadow-sm"></div>
            </div>
        </div>

        <!-- Order Summary & Telemetry Card -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                <div class="d-flex align-items-center mb-3">
                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px; min-width: 45px;">
                        <i class="fa-solid fa-box-archive fs-5"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-0">Shipment & Order Details</h4>
                        <p class="text-muted small mb-0">Complete historical record, fulfillment data, and assigned driver details.</p>
                    </div>
                </div>

                <!-- Order Details Area -->
                <div id="order-details-area">
                    <div class="text-center py-4 text-muted border border-dashed rounded-3 bg-light">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        <span class="small">Loading order telemetry...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/tracker.js"></script>
    
    <script>
        const API_BASE = "https://upheaval-revise-fit.ngrok-free.dev/etransport/api";
        
        // Extract order ID from URL query parameters (e.g., order_history.html?id=3)
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        function getAccessToken() {
            return localStorage.getItem('accessToken');
        }
        
        // Initialize the Leaflet map
        const map = L.map('map').setView([28.5355, 77.3910], 13);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        async function fetchOrderHistoryTrail() {
            const orderDetailsContainer = document.getElementById('order-details-area');
            const titleElement = document.getElementById('order-title');
            const token = getAccessToken();

            if (!orderId) {
                orderDetailsContainer.innerHTML = '<div class="alert alert-danger small">No order ID provided in the URL.</div>';
                return;
            }

            if (!token) {
                orderDetailsContainer.innerHTML = '<div class="alert alert-danger small">Authentication token not found. Please log in.</div>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/orders/history/`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true' 
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch order history.");

                const orders = await response.json();
                console.log(orders);
                const data = orders.find(item => item.id == orderId);
                
                if (!data) {
                    orderDetailsContainer.innerHTML = '<div class="alert alert-warning small">Order not found in history records.</div>';
                    return;
                }

                titleElement.textContent = `Route Trail: Order #${data.id}`;

                // 1. Render Coordinate History Trail / Route Polyline
                if (data.routed_history && data.routed_history.length > 0) {
                    const coordinates = data.routed_history; 
                    const latLngs = coordinates.map(coord => [coord['lat'], coord['lon']]);
                    
                    // Draw Polyline route path
                    const polyline = L.polyline(latLngs, { color: '#0d6efd', weight: 4 }).addTo(map);
                    
                    // Add vertex circle markers with timestamp tooltips
                    coordinates.forEach(coord => {
                        L.circleMarker([coord['lat'], coord['lon']], {
                            radius: 5,
                            fillColor: "#ff7800",
                            color: "#fff",
                            weight: 1,
                            opacity: 0.1,
                            fillOpacity: 0.1
                        })
                        .bindTooltip(`<b>Time:</b> ${new Date(coord['timestamp']).toLocaleTimeString()}`)
                        .addTo(map);
                    });
                    
                    // Zoom map to fit the entire delivery path perfectly
                    map.fitBounds(polyline.getBounds());
                } else {
                    L.marker([28.5355, 77.3910]).addTo(map).bindPopup("No route telemetry coordinates recorded for this order.").openPopup();
                }

                // 2. Render Order Details Card with Driver Information
                const isCancelled = data.status === 'cancelled';
                const badgeBg = isCancelled ? 'bg-danger' : 'bg-success';
                const statusText = isCancelled ? 'CANCELLED' : 'DELIVERED';
                const hasDriver = data.driver_first_name || data.driver_last_name;

                orderDetailsContainer.innerHTML = `
                    <div class="card border border-light shadow-sm rounded-3">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fw-bold text-dark fs-6">Order ID: #${data.id}</span>
                                <span class="badge ${badgeBg} text-uppercase px-2 py-1">${statusText}</span>
                            </div>
                            
                            <div class="row g-2 bg-light p-3 rounded-3 border mb-3 small">
                                <div class="col-12 col-md-6">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">MATERIAL</span>
                                    <strong class="text-dark">${data.material_description}</strong>
                                </div>
                                <div class="col-12 col-md-6">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">CUSTOMER</span>
                                    <strong class="text-dark">${data.customer_first_name || ''} ${data.customer_last_name || ''}</strong>
                                </div>
                                <!-- <div class="col-12 col-md-6 mt-2"> -->
                                    <!-- <span class="text-muted d-block" style="font-size: 0.7rem;">ASSIGNED VEHICLE</span> -->
                                    <!-- <strong class="text-dark">${data.vehicle_no || 'N/A'} (${data.vehicle_type ? data.vehicle_type.toUpperCase() : 'N/A'})</strong> -->
                                <!-- </div> -->
                                <div class="col-12 col-md-6 mt-2">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">CREATED AT</span>
                                    <strong class="text-dark">${new Date(data.created_at).toLocaleString()}</strong>
                                </div>
								<div class="col-12 col-md-6 mt-2">
                                    <span class="text-muted d-block" style="font-size: 0.7rem;">DELIVERED AT</span>
                                    <strong class="text-dark">${new Date(data.completed_at).toLocaleString()}</strong>
                                </div>
                            </div>
                            <p class="mb-1 small"><strong>Pickup Address:</strong> ${data.pickup_address}</p>
                            <p class="mb-0 small"><strong>Delivery Address:</strong> ${data.delivery_address}</p>
                            
							${hasDriver ? `
                                <div class="bg-white p-3 rounded-3 border small text-secondary mb-3">
                                    <div class="fw-semibold text-dark mb-1"><i class="fa-solid fa-id-badge me-1 text-primary"></i> Delivered By:</div>
                                    <div class="row g-2">
                                        <div class="col-12 col-sm-6">👤 <strong>Driver Name:</strong> ${data.driver_first_name || ''} ${data.driver_last_name || ''}</div>
                                        <div class="col-12 col-sm-6">🚚 <strong>Vehicle No:</strong> ${data.vehicle_no || 'N/A'}</div>
                                        <div class="col-12 col-sm-6">📞 <strong>Phone:</strong> ${data.driver_phone_number ? `<a href="tel:${data.driver_phone_number}" class="text-primary fw-semibold text-decoration-none">${data.driver_phone_number}</a>` : 'Not provided'}</div>
                                        <div class="col-12 col-sm-6">📧 <strong>Email:</strong> ${data.driver_email ? `<a href="mailto:${data.driver_email}" class="text-primary fw-semibold text-decoration-none">${data.driver_email}</a>` : 'Not provided'}</div>
                                    </div>
                                </div>
                            ` : ''}


                        </div>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                orderDetailsContainer.innerHTML = `
                    <div class="alert alert-danger small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${err.message}
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchOrderHistoryTrail();
            
            const token = localStorage.getItem('accessToken');
            const userRole = localStorage.getItem('userRole');
            const vehicleId = localStorage.getItem('driver_vehicle_id');

            if (token && vehicleId && userRole === 'driver') {
                startBackgroundDriverTracker();
            }
        });
    </script>
</body>
</html>
