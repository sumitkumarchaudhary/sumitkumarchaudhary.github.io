    <script>
        const API_BASE = 'https://upheaval-revise-fit.ngrok-free.dev/etransport/api';

        // Open the map selector in a separate popup window
        function openMapWindow(targetType) {
            const width = 600;
            const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            
            window.open(
                `map_selector.html?type=${targetType}`, 
                'MapSelector', 
                `width=${width},height=${height},top=${top},left=${left}`
            );
        }

        // Global function called by the popup window when user clicks "Confirm Location"
        function setSelectedLocation(targetType, lat, lon, address) {
            if (targetType === 'pickup') {
                document.getElementById('pickup_lat').value = lat;
                document.getElementById('pickup_lon').value = lon;
                document.getElementById('pickup_address').value = address;
            } else if (targetType === 'delivery') {
                document.getElementById('drop_lat').value = lat;
                document.getElementById('drop_lon').value = lon;
                document.getElementById('delivery_address').value = address;
            }
        }

        // Address Autocomplete Search logic
        let debounceTimer;
        function searchAddress(inputId, suggestionBoxId) {
            clearTimeout(debounceTimer);
            
            debounceTimer = setTimeout(async () => {
                const query = document.getElementById(inputId).value;
                const box = document.getElementById(suggestionBoxId);

                if (query.length < 3) {
                    box.innerHTML = '';
                    return;
                }

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`, {
                        headers: { 'User-Agent': 'eTransportApp/1.0' }
                    });
                    
                    if (!res.ok) throw new Error("Search limit reached");

                    const results = await res.json();
                    box.innerHTML = '';

                    results.forEach(place => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.innerText = place.display_name;
                        item.onclick = () => {
                            document.getElementById(inputId).value = place.display_name;
                            box.innerHTML = '';

                            if (inputId === 'pickup_address') {
                                document.getElementById('pickup_lat').value = place.lat;
                                document.getElementById('pickup_lon').value = place.lon;
                            } else if (inputId === 'delivery_address') {
                                document.getElementById('drop_lat').value = place.lat;
                                document.getElementById('drop_lon').value = place.lon;
                            }
                        };
                        box.appendChild(item);
                    });
                } catch (err) {
                    console.error("Geocoding error:", err);
                }
            }, 400);
        }

        async function submitOrder(event) {
            event.preventDefault();

            const msgElement = document.getElementById('response-msg');
            msgElement.innerHTML = `<div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Submitting order...`;
            msgElement.className = "text-muted";
            
            const payload = {
                material_weight: parseFloat(document.getElementById('totalWeightBadge').textContent.replace(/,/g, '')),
				req_truck_type: parseInt(document.getElementById('vehicleSelect').value),
				<!-- material_description: document.getElementById('material_description').value, -->
				material_description: getMaterialsSummaryText(),
				<!-- material_weight: document.getElementById('material_weight').value, -->
                pickup_address: document.getElementById('local_pickup_address').value || document.getElementById('pickup_address').value || "Null",
                delivery_address: document.getElementById('local_delivery_address').value || document.getElementById('delivery_address').value || "Null",
                pickup_lat: document.getElementById('pickup_lat').value ? parseFloat(document.getElementById('pickup_lat').value) : null,
                pickup_lon: document.getElementById('pickup_lon').value ? parseFloat(document.getElementById('pickup_lon').value) : null,
                dropoff_lat: document.getElementById('drop_lat').value ? parseFloat(document.getElementById('drop_lat').value) : null,
                dropoff_lon: document.getElementById('drop_lon').value ? parseFloat(document.getElementById('drop_lon').value) : null,
                <!-- req_vehicle_type: document.querySelector('input[name="vehicle_type"]:checked')?.value || "" -->
            };
			console.log(payload);
            const token = localStorage.getItem('accessToken');
            if (!token) {
                msgElement.innerHTML = `<div class="alert alert-danger small mt-3">Error: You must be logged in as a customer.</div>`;
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/orders/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || JSON.stringify(data) || "Failed to create order.");

                msgElement.innerHTML = `
                    <div class="alert alert-success small mt-3" role="alert">
                        <i class="fa-solid fa-circle-check me-1"></i> Success! Order #${data.id} created successfully.
                    </div>`;
                document.getElementById('order-form').reset();
            } catch (err) {
                console.error(err);
                msgElement.innerHTML = `
                    <div class="alert alert-danger small mt-3" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${err.message}<br>
                        <a href="index.html" class="alert-link fw-semibold">Return to Dashboard</a>
                    </div>`;
            }
        }

	    async function useCurrentLocationForPickup() {
            const addressInput = document.getElementById('pickup_address');
            addressInput.value = "Fetching your location...";

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                addressInput.value = "";
                return;
            }

            navigator.geolocation.getCurrentPosition(async position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                document.getElementById('pickup_lat').value = lat;
                document.getElementById('pickup_lon').value = lon;

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
                        headers: { 'User-Agent': 'eTransportApp/1.0' }
                    });
                    
                    if (!res.ok) throw new Error("Failed to reverse geocode location.");

                    const data = await res.json();
                    addressInput.value = data.display_name ? data.display_name : `${lat}, ${lon}`;
                } catch (err) {
                    console.error("Reverse geocoding error:", err);
                    addressInput.value = `Lat: ${lat}, Lon: ${lon}`;
                }
            }, () => {
                alert("Unable to retrieve your location. Please check your browser permissions.");
                addressInput.value = "";
            }, { timeout: 10000 });
        }
		// Run on page load
        document.addEventListener('DOMContentLoaded', useCurrentLocationForPickup);
		
		//	
		
		let availableMaterials = []; // Cache materials fetched from backend
		// 1. Fetch materials from your backend on page load
		async function loadMaterialsForDynamicRows() {
			const token = localStorage.getItem('accessToken');
			try {
				const response = await fetch(`${API_BASE}/materials/`, {
					method: 'GET',
					headers: {
						'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true'
					}
				});
				if (response.ok) {
					availableMaterials = await response.json();
				}
			} catch (err) {
				console.error("Failed to load materials:", err);
			}
			
			// Add the first default row once materials are loaded
			addMaterialRow();
		}
		
		// Call loadMaterialsForDynamicRows() inside your DOMContentLoaded event
		document.addEventListener('DOMContentLoaded', () => {
			loadMaterialsForDynamicRows();
		});

		// 2. Add a new material row
		function addMaterialRow() {
			const container = document.getElementById('materialRowsContainer');
			
			// Build options HTML from cached materials with data-unit attribute
			let optionsHtml = '<option value="" disabled selected>Select Material</option>';
			availableMaterials.forEach(mat => {
				const unit = mat.material_weight_unit || 'kg';
				optionsHtml += `<option value="${mat.id}" data-unit="${unit}">${mat.name} (${unit})</option>`;
			});

			const rowDiv = document.createElement('div');
			rowDiv.className = 'row g-2 align-items-center material-row mb-2';
			rowDiv.innerHTML = `
				<div class="col-6">
					<select name="material_id[]" class="form-select bg-light shadow-none material-select" required onchange="updateRowUnit(this)">
						${optionsHtml}
					</select>
				</div>
				<div class="col-5">
					<div class="input-group">
						<input type="number" step="0.01" name="quantity[]" class="form-control bg-light shadow-none material-qty" placeholder="Qty" required>
						<span class="input-group-text bg-white text-muted small unit-label">kg</span>
					</div>
				</div>
				<div class="col-1 text-center">
					<button type="button" class="btn btn-outline-danger btn-sm border-0 shadow-none" onclick="removeMaterialRow(this)" title="Remove">
						<i class="fa-solid fa-trash-can"></i>
					</button>
				</div>
			`;
			container.appendChild(rowDiv);
		}

		// Dynamically updates the unit label when the user changes the material selection
		function updateRowUnit(selectElement) {
			const row = selectElement.closest('.material-row');
			const selectedOption = selectElement.options[selectElement.selectedIndex];
			const unit = selectedOption.getAttribute('data-unit') || 'kg';
			
			// Update the unit label span
			row.querySelector('.unit-label').textContent = unit;
			
			// Recalculate weight immediately
			calculateTotalWeightAndFilterTrucks();
		}

		function removeMaterialRow(button) {
			const row = button.closest('.material-row');
			const container = document.getElementById('materialRowsContainer');
			
			if (container.children.length > 1) {
				row.remove();
				calculateTotalWeightAndFilterTrucks();
			} else {
				alert("You must include at least one material.");
			}
		}
		
		
		function getMaterialsSummaryText() {
			const rows = document.querySelectorAll('.material-row');
			const summaryParts = [];

			rows.forEach(row => {
				const selectElement = row.querySelector('.material-select');
				const qtyInput = row.querySelector('.material-qty');
				const unitLabel = row.querySelector('.unit-label');

				// Check if a material is selected and quantity is entered
				if (selectElement && selectElement.selectedIndex > 0 && qtyInput.value) {
					// Get material name without the unit suffix (e.g., "Cement (kg)" -> "Cement")
					const fullOptionText = selectElement.options[selectElement.selectedIndex].text;
					const materialName = fullOptionText.split(' (')[0]; 
					
					const qty = qtyInput.value;
					const unit = unitLabel ? unitLabel.textContent : 'kg';

					summaryParts.push(`${qty} ${unit} ${materialName}`);
				}
			});

			// Join all parts with a comma and space (e.g., "50 kg Cement, 2 tonnes Sand")
			return summaryParts.join(', ');
		}
		
		
		let allTrucks = [];
		// 1. Fetch trucks from backend on page load
		async function loadTrucksDropdown() {
			const token = localStorage.getItem('accessToken');
			const selectElement = document.getElementById('vehicleSelect');

			try {
				const response = await fetch(`${API_BASE}/trucks/`, {
					method: 'GET',
					headers: {
						'Authorization': `Bearer ${token}`,
						'ngrok-skip-browser-warning': 'true'
					}
				});

				if (!response.ok) throw new Error("Failed to fetch vehicles.");

				allTrucks = await response.json();
				
				// Initial population (unfiltered until weight is entered)
				updateTruckDropdownOptions(0);

			} catch (err) {
				console.error('Error loading trucks:', err);
				selectElement.innerHTML = '<option value="" disabled selected>Error loading trucks</option>';
			}
		}
		
		// Convert any weight unit into standardized Kilograms (kg)
		function convertToKg(value, unit) {
			if (!value || isNaN(value)) return 0;
			const u = (unit || 'kg').toLowerCase().trim();
			
			switch (u) {
				case 'g':
				case 'gram':
				case 'grams':
					return value / 1000;
				case 'quintal':
				case 'quintals':
					return value * 100;
				case 'tonne':
				case 'tonnes':
				case 'ton':
				case 't':
					return value * 1000;
				case 'kg':
				case 'kilogram':
				case 'kilograms':
				default:
					return value; // already in kg
			}
		}

		// Calculate total weight in kg across all rows with mixed units
		function calculateTotalWeightAndFilterTrucks() {
			const rows = document.querySelectorAll('.material-row');
			let totalWeightKg = 0;

			rows.forEach(row => {
				const qtyInput = row.querySelector('.material-qty');
				const selectElement = row.querySelector('.material-select');
				const qty = parseFloat(qtyInput.value) || 0;
				
				let unit = 'kg';
				if (selectElement.selectedIndex > 0) {
					const selectedOption = selectElement.options[selectElement.selectedIndex];
					unit = selectedOption.getAttribute('data-unit') || 'kg';
				}

				// Convert row quantity to kg and add to total sum
				totalWeightKg += convertToKg(qty, unit);
			});

			// Update UI Badge
			const weightBadge = document.getElementById('totalWeightBadge');
			if (weightBadge) {
				weightBadge.textContent = `${totalWeightKg.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2})}`;
			}

			// Filter and repopulate backend truck dropdown based on standardized total weight
			updateTruckDropdownOptions(totalWeightKg);
		}
		
		
		// Render filtered trucks into the select element
		function updateTruckDropdownOptions(currentWeight) {
			const selectElement = document.getElementById('vehicleSelect');
			selectElement.innerHTML = '<option value="" disabled selected>Choose a suitable truck</option>';
			
			console.log(allTrucks);
			let validTrucksCount = 0;

			allTrucks.forEach(truck => {
				
				// Adjust property name based on your backend serializer (e.g., truck.capacity or truck.max_weight)
				const truckCapacity = parseFloat(truck.max_load_capacity); 
				console.log(truckCapacity);
				const truckTypeLabel =  `${truck.truck_type} - (Capacity: ${truck.min_load_capacity} to ${truck.max_load_capacity} kg)`;
				
				const option = document.createElement('option');
				option.value = truck.id;
			

				if (currentWeight > 0 && currentWeight > truckCapacity) {
					// Overweight for this truck - disable or style it as unavailable
					option.textContent = `${truckTypeLabel} [Overweight]`;
					option.disabled = true;
					option.style.color = '#9ca3af';
				} else {
					// Suitable truck
					option.textContent = `${truckTypeLabel}`;
					validTrucksCount++;
				}

				selectElement.appendChild(option);
			});

			if (validTrucksCount === 0 && currentWeight > 0) {
				selectElement.innerHTML = '<option value="" disabled selected>No trucks available for this weight (Exceeds max capacity)</option>';
			}
		}
