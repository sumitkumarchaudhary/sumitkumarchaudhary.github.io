<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place a Material Order - Fleet Dashboard</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Selected State for Vehicle Type Radio Buttons */
        .btn-check:checked + .btn {
            background-color: #e6f0ff !important;
            border-color: #0d6efd !important;
            color: #0b5ed7 !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }
        /* Autocomplete suggestions dropdown */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            max-height: 180px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.08);
        }
        .suggestion-item {
            padding: 10px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid #f8f9fa;
        }
        .suggestion-item:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 900px;">
        
        <!-- Back Button -->
        <a href="index.html" class="btn btn-link text-decoration-none px-0 mb-3 text-muted fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>

        <!-- Main Card Container -->
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Header Section -->
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; min-width: 50px; font-size: 1.25rem;">
                        <i class="fa-solid fa-boxes-stacked"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold text-dark mb-0">Place a Material Order</h3>
                        <p class="text-muted small mb-0">Specify requirements and dispatch locations for your shipment.</p>
                    </div>
                </div>

                <!-- Order Form -->
                <form id="order-form" onsubmit="submitOrder(event)" novalidate>
                    
                    <!-- Vehicle Type Grid -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Required Commercial Vehicle Type</label>
                        <div class="row g-2">
                            <div class="col-12 col-sm-6">
                                <input type="radio" class="btn-check" name="vehicle_type" id="type_small" value="small" required>
                                <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_small">
                                    Small (≤ 3.5 tonnes)
                                </label>
                            </div>
                            <div class="col-12 col-sm-6">
                                <input type="radio" class="btn-check" name="vehicle_type" id="type_light" value="light">
                                <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_light">
                                    Light (3.5 to 7.5 tonnes)
                                </label>
                            </div>
                            <div class="col-12 col-sm-6">
                                <input type="radio" class="btn-check" name="vehicle_type" id="type_medium" value="medium">
                                <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_medium">
                                    Medium (7.5 to 18.5 tonnes)
                                </label>
                            </div>
                            <div class="col-12 col-sm-6">
                                <input type="radio" class="btn-check" name="vehicle_type" id="type_heavy" value="heavy">
                                <label class="btn btn-outline-light text-dark border w-100 py-2 text-start small fw-medium" for="type_heavy">
                                    Heavy (≥ 18.5 tonnes)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Material Description -->
                    <div class="mb-3">
                        <label for="material_description" class="form-label text-muted small fw-semibold">Material Description</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-cube"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0 shadow-none" id="material_description" placeholder="e.g., Sand, Bricks, Cement" required>
                        </div>
                    </div>

                    <!-- Pickup Location -->
                    <div class="mb-3 position-relative">
                        <label for="pickup_address" class="form-label text-muted small fw-semibold">Pickup Location (Source)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-location-dot"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0 shadow-none" id="pickup_address" placeholder="Type source address..." autocomplete="off" oninput="searchAddress('pickup_address', 'pickup-suggestions')" required>
                            <button class="btn btn-light border border-start-0 text-primary" type="button" onclick="useCurrentLocationForPickup()" title="Use Current GPS Location">
                                <i class="fa-solid fa-crosshairs"></i>
                            </button>
                        </div>
                        <div id="pickup-suggestions" class="suggestions-box"></div>
                        
                        <!-- Hidden coordinates -->
                        <input type="hidden" id="pickup_lat">
                        <input type="hidden" id="pickup_lon">
                        
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <a class="small text-primary text-decoration-none fw-medium cursor-pointer" onclick="openMapWindow('pickup')">
                                <i class="fa-solid fa-map me-1"></i> Pinpoint on map
                            </a>
                        </div>
                    </div>

                    <!-- Local Pickup Address Optional -->
                    <div class="mb-3">
                        <label for="local_pickup_address" class="form-label text-muted small fw-semibold">Local Pickup Address <span class="text-muted fw-normal">(Optional)</span></label>
                        <input type="text" class="form-control bg-light shadow-none" id="local_pickup_address" placeholder="e.g., Gate No. 3, Warehouse B">
                    </div>

                    <!-- Delivery Location -->
                    <div class="mb-3 position-relative">
                        <label for="delivery_address" class="form-label text-muted small fw-semibold">Delivery Location (Destination)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-flag-checkered"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0 shadow-none" id="delivery_address" placeholder="Type destination location..." autocomplete="off" oninput="searchAddress('delivery_address', 'delivery-suggestions')" required>
                        </div>
                        <div id="delivery-suggestions" class="suggestions-box"></div>
                        
                        <!-- Hidden coordinates -->
                        <input type="hidden" id="drop_lat">
                        <input type="hidden" id="drop_lon">
                        
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <a class="small text-primary text-decoration-none fw-medium cursor-pointer" onclick="openMapWindow('delivery')">
                                <i class="fa-solid fa-map me-1"></i> Pinpoint on map
                            </a>
                        </div>
                    </div>

                    <!-- Local Delivery Address Optional -->
                    <div class="mb-4">
                        <label for="local_delivery_address" class="form-label text-muted small fw-semibold">Local Delivery Address <span class="text-muted fw-normal">(Optional)</span></label>
                        <input type="text" class="form-control bg-light shadow-none" id="local_delivery_address" placeholder="e.g., Site Office, Tower 4">
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-3 shadow-sm">
                            <i class="fa-solid fa-paper-plane me-1"></i> Submit Order
                        </button>
                    </div>

                </form>

                <!-- Response Message Container -->
                <div id="response-msg" class="text-center small"></div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_URL = 'https://upheaval-revise-fit.ngrok-free.dev/etransport/api/orders/';

        // Open the map selector in a separate popup window
        function openMapWindow(targetType) {
            const width = 600;
            const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            
            window.open(
                `map_selector.html?type=${targetType}`, 
                'MapSelector', 
                `width=${width},height=${height},top=${top},left=${left}`
            );
        }

        // Global function called by the popup window when user clicks "Confirm Location"
        function setSelectedLocation(targetType, lat, lon, address) {
            if (targetType === 'pickup') {
                document.getElementById('pickup_lat').value = lat;
                document.getElementById('pickup_lon').value = lon;
                document.getElementById('pickup_address').value = address;
            } else if (targetType === 'delivery') {
                document.getElementById('drop_lat').value = lat;
                document.getElementById('drop_lon').value = lon;
                document.getElementById('delivery_address').value = address;
            }
        }

        // Address Autocomplete Search logic
        let debounceTimer;
        function searchAddress(inputId, suggestionBoxId) {
            clearTimeout(debounceTimer);
            
            debounceTimer = setTimeout(async () => {
                const query = document.getElementById(inputId).value;
                const box = document.getElementById(suggestionBoxId);

                if (query.length < 3) {
                    box.innerHTML = '';
                    return;
                }

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`, {
                        headers: { 'User-Agent': 'eTransportApp/1.0' }
                    });
                    
                    if (!res.ok) throw new Error("Search limit reached");

                    const results = await res.json();
                    box.innerHTML = '';

                    results.forEach(place => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.innerText = place.display_name;
                        item.onclick = () => {
                            document.getElementById(inputId).value = place.display_name;
                            box.innerHTML = '';

                            if (inputId === 'pickup_address') {
                                document.getElementById('pickup_lat').value = place.lat;
                                document.getElementById('pickup_lon').value = place.lon;
                            } else if (inputId === 'delivery_address') {
                                document.getElementById('drop_lat').value = place.lat;
                                document.getElementById('drop_lon').value = place.lon;
                            }
                        };
                        box.appendChild(item);
                    });
                } catch (err) {
                    console.error("Geocoding error:", err);
                }
            }, 400);
        }

        async function submitOrder(event) {
            event.preventDefault();

            const msgElement = document.getElementById('response-msg');
            msgElement.innerHTML = `<div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Submitting order...`;
            msgElement.className = "text-muted";
            
            const payload = {
                material_description: document.getElementById('material_description').value,
                pickup_address: document.getElementById('local_pickup_address').value || document.getElementById('pickup_address').value || "Null",
                delivery_address: document.getElementById('local_delivery_address').value || document.getElementById('delivery_address').value || "Null",
                pickup_lat: document.getElementById('pickup_lat').value ? parseFloat(document.getElementById('pickup_lat').value) : null,
                pickup_lon: document.getElementById('pickup_lon').value ? parseFloat(document.getElementById('pickup_lon').value) : null,
                dropoff_lat: document.getElementById('drop_lat').value ? parseFloat(document.getElementById('drop_lat').value) : null,
                dropoff_lon: document.getElementById('drop_lon').value ? parseFloat(document.getElementById('drop_lon').value) : null,
                req_vehicle_type: document.querySelector('input[name="vehicle_type"]:checked')?.value || ""
            };

            const token = localStorage.getItem('accessToken');
            if (!token) {
                msgElement.innerHTML = `<div class="alert alert-danger small mt-3">Error: You must be logged in as a customer.</div>`;
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || JSON.stringify(data) || "Failed to create order.");

                msgElement.innerHTML = `
                    <div class="alert alert-success small mt-3" role="alert">
                        <i class="fa-solid fa-circle-check me-1"></i> Success! Order #${data.id} created successfully.
                    </div>`;
                document.getElementById('order-form').reset();
            } catch (err) {
                console.error(err);
                msgElement.innerHTML = `
                    <div class="alert alert-danger small mt-3" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Error: ${err.message}<br>
                        <a href="index.html" class="alert-link fw-semibold">Return to Dashboard</a>
                    </div>`;
            }
        }

	    async function useCurrentLocationForPickup() {
            const addressInput = document.getElementById('pickup_address');
            addressInput.value = "Fetching your location...";

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                addressInput.value = "";
                return;
            }

            navigator.geolocation.getCurrentPosition(async position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                document.getElementById('pickup_lat').value = lat;
                document.getElementById('pickup_lon').value = lon;

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
                        headers: { 'User-Agent': 'eTransportApp/1.0' }
                    });
                    
                    if (!res.ok) throw new Error("Failed to reverse geocode location.");

                    const data = await res.json();
                    addressInput.value = data.display_name ? data.display_name : `${lat}, ${lon}`;
                } catch (err) {
                    console.error("Reverse geocoding error:", err);
                    addressInput.value = `Lat: ${lat}, Lon: ${lon}`;
                }
            }, () => {
                alert("Unable to retrieve your location. Please check your browser permissions.");
                addressInput.value = "";
            }, { timeout: 10000 });
        }
		
		// Run on page load
        document.addEventListener('DOMContentLoaded', useCurrentLocationForPickup);
    </script>
</body>
</html>
