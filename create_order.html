    <title>Create Supply Order with Address Search</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f8fafc; margin: 0px auto; max-width: 500px; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: #4f46e5; margin-top: 0; }
        .back-btn { display: inline-block; margin-bottom: 1.5rem; color: #4f46e5; text-decoration: none; font-weight: 600; }
        .back-btn:hover { text-decoration: underline; }
        
        .form-group { margin-bottom: 16px; position: relative; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #1e293b; }
        input[type="text"] { width: 100%; height: 42px; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        
        /* Map Toggle Styles */
        .map-toggle-link {
            color: #007BFF;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
            display: inline-block;
            margin-top: 5px;
        }
        #map-container {
            display: none;
            margin-top: 10px;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 8px;
            background: #f8f9fa;
        }
        #map {
            height: 300px;
            width: 100%;
            margin-top: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        #address-box {
            font-size: 13px;
            background-color: #fff;
            padding: 8px;
            border-left: 4px solid #10b981;
            border-radius: 4px;
        }
        .loading { color: #666; font-style: italic; }

        /* Autocomplete dropdown styling */
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #cbd5e1; border-radius: 0 0 6px 6px; max-height: 150px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .suggestion-item { padding: 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .suggestion-item:hover { background-color: #f8fafc; }

        button[type="submit"] { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button[type="submit"]:hover { background: #4338ca; }
        
        #response-msg { margin-top: 15px; font-weight: 600; text-align: center; font-size: 14px; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        
        .vehicle-type-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .vehicle-option { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: #1e293b; flex: 1; min-width: 110px; }
        .vehicle-option:hover { border-color: #4f46e5; background: #eef2ff; }
        .vehicle-option input[type="radio"] { accent-color: #4f46e5; cursor: pointer; }

        .location-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; }
        .location-grid button { height: 42px; padding: 0 10px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; transition: background-color 0.2s; }
        .location-grid button:hover { background-color: #4338ca; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
    <div class="card">
        <h2>📦 Place a Material Order</h2>
        <form id="order-form" onsubmit="submitOrder(event)">
            
            <div class="form-group">
                <label>Required Vehicle Type</label>
                <div class="vehicle-type-group">
                    <label class="vehicle-option">
                        <input type="radio" name="vehicle_type" value="light" required>
                        Commercial (Light)
                    </label>
                    <label class="vehicle-option">
                        <input type="radio" name="vehicle_type" value="heavy">
                        Commercial (Heavy)
                    </label>
                    <label class="vehicle-option">
                        <input type="radio" name="vehicle_type" value="other">
                        Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="material_description">Material Description</label>
                <input type="text" id="material_description" placeholder="e.g., Sand, Bricks, Cement" required>
            </div>

            <!-- Pickup / Source Address Search -->
            <div class="form-group">
                <label for="pickup_address">Pickup Location (Source)</label>
                <div class="location-grid">
                    <input type="text" id="pickup_address" placeholder="Type source address..." autocomplete="off" oninput="searchAddress('pickup_address', 'pickup-suggestions')" required>
                    <button type="button" onclick="useCurrentLocationForPickup()" title="Use Current Location">📍</button>
                </div>
                <div id="pickup-suggestions" class="suggestions-box"></div>

                <!-- Hidden coordinate holders -->
                <input type="hidden" id="pickup_lat">
                <input type="hidden" id="pickup_lon">
				<!-- For Pickup -->
				<a class="map-toggle-link" onclick="openMapWindow('pickup')">Can't find address? Click here to select on map</a>
				<br>
            </div>
            
            <div class="form-group">
                <label for="local_pickup_address">Local Pickup Address (Optional)</label>
                <input type="text" id="local_pickup_address" placeholder="Type local pickup address">
            </div>

            <!-- Delivery / Destination Address Search -->
            <div class="form-group">
                <label for="delivery_address">Delivery Location (Destination)</label>
                <input type="text" id="delivery_address" placeholder="Type destination location..." autocomplete="off" oninput="searchAddress('delivery_address', 'delivery-suggestions')" required>
                <div id="delivery-suggestions" class="suggestions-box"></div>
				<!-- For Delivery -->
				<a class="map-toggle-link" onclick="openMapWindow('delivery')">Can't find address? Click here to select on map</a>
                <!-- Hidden coordinate holders -->
                <input type="hidden" id="drop_lat">
                <input type="hidden" id="drop_lon">
            </div>

            <div class="form-group">
                <label for="local_delivery_address">Local Delivery Address (Optional)</label>
                <input type="text" id="local_delivery_address" placeholder="Type local delivery address">
            </div>

            <!-- Shared Collapsible Map Selector Box -->
            <div id="map-container">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <b id="map-title">Pinpoint Location on Map:</b>
                    <span style="cursor:pointer; color: red; font-weight: bold;" onclick="toggleMapSelector()">[X Close]</span>
                </div>
                <div id="address-box"><b>Selected:</b> <span id="address-text" class="loading">Click anywhere on the map...</span></div>
                <div id="map"></div>
            </div>

            <button type="submit">Submit Order</button>
        </form>
        <p id="response-msg"></p>
    </div>

        // Address Autocomplete Search logic
        let debounceTimer;
        function searchAddress(inputId, suggestionBoxId) {
            clearTimeout(debounceTimer);
            
            debounceTimer = setTimeout(async () => {
                const query = document.getElementById(inputId).value;
                const box = document.getElementById(suggestionBoxId);

                if (query.length < 3) {
                    box.innerHTML = '';
                    return;
                }

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`, {
                        headers: { 'User-Agent': 'eTransportApp/1.0' }
                    });
                    
                    if (!res.ok) throw new Error("Search limit reached");

                    const results = await res.json();
                    box.innerHTML = '';

                    results.forEach(place => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.innerText = place.display_name;
                        item.onclick = () => {
                            document.getElementById(inputId).value = place.display_name;
                            box.innerHTML = '';

                            if (inputId === 'pickup_address') {
                                document.getElementById('pickup_lat').value = place.lat;
                                document.getElementById('pickup_lon').value = place.lon;
                            } else if (inputId === 'delivery_address') {
                                document.getElementById('drop_lat').value = place.lat;
                                document.getElementById('drop_lon').value = place.lon;
                            }
                        };
                        box.appendChild(item);
                    });
                } catch (err) {
                    console.error("Geocoding error:", err);
                }
            }, 400);
        }

        async function submitOrder(event) {
            event.preventDefault();

            const msgElement = document.getElementById('response-msg');
            msgElement.innerText = "Submitting order...";
            msgElement.className = "";
            
            const payload = {
                material_description: document.getElementById('material_description').value,
                pickup_address: document.getElementById('local_pickup_address').value || document.getElementById('pickup_address').value || "Null",
                delivery_address: document.getElementById('local_delivery_address').value || document.getElementById('delivery_address').value || "Null",
                pickup_lat: document.getElementById('pickup_lat').value ? parseFloat(document.getElementById('pickup_lat').value) : null,
                pickup_lon: document.getElementById('pickup_lon').value ? parseFloat(document.getElementById('pickup_lon').value) : null,
                dropoff_lat: document.getElementById('drop_lat').value ? parseFloat(document.getElementById('drop_lat').value) : null,
                dropoff_lon: document.getElementById('drop_lon').value ? parseFloat(document.getElementById('drop_lon').value) : null,
                req_vehicle_type: document.querySelector('input[name="vehicle_type"]:checked')?.value || ""
            };

            const token = localStorage.getItem('accessToken');
            if (!token) {
                msgElement.innerText = "Error: You must be logged in as a customer.";
                msgElement.className = "error";
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || JSON.stringify(data) || "Failed to create order.");

                msgElement.innerText = `Success! Order #${data.id} created successfully.`;
                msgElement.className = "success";
                document.getElementById('order-form').reset();
            } catch (err) {
                console.error(err);
                msgElement.innerHTML = `
                    <p style="margin: 0 0 6px 0; color: #ef4444;">Error: ${err.message}</p>
                    <p style="margin: 0;">Click here to go to <a href="index.html" style="color: #4f46e5; text-decoration: underline; font-weight: 600;">Home Page</a></p>
                `;
                msgElement.className = "error";
            }
        }

        async function useCurrentLocationForPickup() {
            const addressInput = document.getElementById('pickup_address');
            addressInput.value = "Fetching your location...";

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                addressInput.value = "";
                return;
            }

            navigator.geolocation.getCurrentPosition(async position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                document.getElementById('pickup_lat').value = lat;
                document.getElementById('pickup_lon').value = lon;

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
                        headers: { 'User-Agent': 'eTransportApp/1.0' }
                    });
                    
                    if (!res.ok) throw new Error("Failed to reverse geocode location.");

                    const data = await res.json();
                    addressInput.value = data.display_name ? data.display_name : `${lat}, ${lon}`;
                } catch (err) {
                    console.error("Reverse geocoding error:", err);
                    addressInput.value = `Lat: ${lat}, Lon: ${lon}`;
                }
            }, () => {
                alert("Unable to retrieve your location. Please check your browser permissions.");
                addressInput.value = "";
            }, { timeout: 10000 });
        }
